<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALMEX – Calculator LIVE</title>
<style>
:root{--red:#e30613;--ink:#171717;--muted:#737373;--line:#e8e8e8;--bg:#f5f5f5;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:900;letter-spacing:.5px;font-size:21px}.brand span{color:var(--red)}.top small{color:var(--muted)}
main{width:min(680px,100%);margin:0 auto;padding:28px 18px 110px;flex:1;display:flex;flex-direction:column}
.live-tag{font-size:11px;letter-spacing:1.5px;color:var(--red);font-weight:800;margin:16px 0 14px}
.progress{height:3px;background:#e6e6e6;border-radius:9px;overflow:hidden;margin-bottom:34px}.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}
.stepcount{font-size:12px;color:var(--muted);margin-bottom:10px}
h1{font-size:clamp(25px,5vw,34px);line-height:1.15;margin:0 0 24px;letter-spacing:-.7px}
.hint{font-size:14px;color:var(--muted);line-height:1.5;margin:-12px 0 22px}
.options{display:grid;gap:10px}
.option{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 18px;text-align:left;font-weight:700;color:var(--ink);transition:.15s;min-height:58px}
.option:hover{border-color:#aaa}.option.selected{border:2px solid var(--red);padding:16px 17px;background:#fffafa}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;border:1px solid #ddd;border-radius:10px;padding:15px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--red)}
.full{grid-column:1/-1}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:5}
.bottom button{width:min(210px,42vw);border-radius:10px;padding:14px 12px;font-weight:700;border:1px solid var(--line);background:#fff}
.bottom .cancel{color:#777}.bottom .next{background:var(--red);color:#fff;border-color:var(--red)}
.bottom button:disabled{opacity:.35;cursor:not-allowed}
.summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:10px 0 18px}
.sumrow{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}.sumrow:last-child{border:0}.sumrow strong{text-align:right}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{border:0;border-radius:11px;padding:16px 10px;font-weight:800;background:var(--red);color:#fff}.actions button.secondary{background:#222}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-top:14px}.archive-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.archive-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.archive-actions button,.plain-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.danger-btn{color:#b00000}.internal-grid{display:grid;gap:0}
.hidden{display:none!important}
@media(max-width:520px){main{padding-top:18px}.fields{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:0 16px}.actions{grid-template-columns:1fr}}
@media print{
 body{background:#fff}.top,.live-tag,.progress,.bottom,.actions,.screen-only,#archive{display:none!important}
 main{width:100%;padding:0;display:block}.printdoc{display:block!important}
 .printdoc h1{font-size:25px}.printdoc .summary{border:0;padding:0}.printdoc .sumrow{font-size:13px}
}
.printdoc{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<body>
<div class="app">
<header class="top"><div class="brand">VAL<span>MEX</span></div><div style="display:flex;align-items:center;gap:14px"><small>Calculator ofertare · LIVE</small><button id="settingsBtn" style="border:1px solid #e8e8e8;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700">Setări</button><button id="archiveBtn" style="border:1px solid #e8e8e8;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700">Arhivă</button></div></header>
<main>
  <div class="live-tag">CONVERSAȚIE LIVE</div>
  <div class="progress"><i id="bar"></i></div>
  <section id="screen" class="screen-only"></section>
  <section id="result" class="screen-only hidden"></section>
  <section id="archive" class="screen-only hidden"></section>
  <section id="printdoc" class="printdoc"></section>
  <section id="settingsPanel" class="panel hidden screen-only" style="position:fixed;z-index:20;inset:5vh 12px auto;max-height:90vh;overflow:auto;box-shadow:0 12px 50px #0003"></section>
</main>
<footer class="bottom" id="nav">
  <button class="cancel" id="back">← Înapoi</button>
  <button class="cancel" id="quit">Renunță</button>
  <button class="next hidden" id="continue">Continuă →</button>
</footer>
</div>
<script>
const $=id=>document.getElementById(id);
const SETTINGS_KEY='valmex_live_settings_v2';
const DEFAULT_SETTINGS={roofTariffs:[1250,1350,1450,1600],tileCost:136,accessoriesPercent:35,laborCost:300,consumables:10000,woodCostPerM3:6800,beamCostPerM3:4000,beamWidth:0.2,beamHeight:0.2,blockLengthCm:40,blockHeightCm:20,blockThicknessCm:20,blockWastePercent:0,masonryLaborPerM3:1600,commission:{3:5,4:6,6:8,10:13.5,12:15.5,18:20,24:25}};
function loadSettings(){try{const x=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');return {...DEFAULT_SETTINGS,...x,commission:{...DEFAULT_SETTINGS.commission,...(x.commission||{})}}}catch(e){return {...DEFAULT_SETTINGS,commission:{...DEFAULT_SETTINGS.commission}}}}
let settings=loadSettings();
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));return true}catch(e){alert('Setările nu au putut fi salvate în acest browser.');return false}}
const state={
 type:'turnkey', length:10,width:12, slopes:2,pitch:35,eave:.6,beam:'no',
 tile:'Kvadro 0,45 mm', tileNote:'Modelul și culoarea se aleg ulterior.', clientName:'', clientPhone:'', clientAddress:'', clientEmail:'',
 payment:'installments', months:12, payer:'valmex', price:1250,
 customPrice:1250, beamWidth:settings.beamWidth,beamHeight:settings.beamHeight,
  masonry:'no', masonryHeightCm:20, openingsArea:0, blockPrice:0, masonryLaborRate:1600,
  slab:'no', slabThickness:0, concretePrice:settings.concretePriceDefault, pumpCost:settings.pumpCostDefault, slabOtherCost:settings.slabOtherCostDefault,
  firstPayment:0, extraItems:[]
};
const history=[];
function stateDefaults(){return {type:'turnkey',length:10,width:12,slopes:2,pitch:35,eave:.6,beam:'no',tile:'Kvadro 0,45 mm',tileNote:'Modelul și culoarea se aleg ulterior.',clientName:'',clientPhone:'',clientAddress:'',clientEmail:'',payment:'installments',months:12,payer:'valmex',price:1250,customPrice:1250,beamWidth:settings.beamWidth,beamHeight:settings.beamHeight,masonry:'no',masonryHeightCm:20,openingsArea:0,blockPrice:0,masonryLaborRate:settings.masonryLaborPerM3,slab:'no',slabThickness:0,concretePrice:settings.concretePriceDefault,pumpCost:settings.pumpCostDefault,slabOtherCost:settings.slabOtherCostDefault,firstPayment:0,extraItems:[]};}
const steps=[
 {key:'type',q:'Ce tip de lucrare dorește clientul?',opts:[['turnkey','Acoperiș la cheie'],['install','Montare acoperiș'],['materials','Doar materiale']]},
 {key:'dimensions',q:'Care sunt dimensiunile casei?',hint:'Introdu dimensiunile în metri.',fields:[['length','Lungime (m)','number'],['width','Lățime (m)','number']]},
  {key:'masonry',q:'Este necesară executarea lucrărilor de zidărie?',opts:[['no','Nu'],['yes','Da']]},
  {key:'masonryData',q:'Date pentru calculul zidăriei',hint:'Înălțimea se selectează din 20 în 20 cm. Manopera este calculată pe m³ de zidărie.',fields:[['openingsArea','Suprafața golurilor (m²)','number',false],['blockPrice','Preț unitar bloc (lei/buc.)','number',false],['masonryLaborRate','Manoperă zidărie (lei/m³)','number',false]]},
  {key:'slab',q:'Este necesară turnarea planșeului din beton?',opts:[['no','Nu'],['yes','Da']]},
  {key:'slabData',q:'Date pentru calculul planșeului',hint:'Volum geometric; grinzile, golurile, pierderile și armătura nu sunt incluse automat.',fields:[['slabThickness','Grosime planșeu (cm)','number',true],['concretePrice','Preț beton (lei/m³)','number',false],['pumpCost','Cost pompă (lei, opțional)','number',false],['slabOtherCost','Alte cheltuieli (lei, opțional)','number',false]]},
 {key:'slopes',q:'Câte ape are acoperișul?',opts:[['2','2 ape'],['4','4 laturi (4 ape)'],['custom','Altă configurație']]},
 {key:'pitch',q:'Care este înclinația acoperișului?',opts:[['35','35° – standard'],['25','25°'],['30','30°'],['40','40°'],['45','45°'],['custom','Introduc manual']]},
 {key:'eave',q:'Cât este șandrama?',opts:[['0','Fără șandrama'],['0.4','40 cm'],['0.6','60 cm – standard'],['0.8','80 cm'],['1','100 cm'],['custom','Introduc manual']]},
 {key:'beam',q:'Este necesară centura de beton?',opts:[['no','Nu'],['yes','Da']]},
 {key:'tile',q:'Ce tip de învelitoare alegem?',opts:[['Kvadro 0,45 mm','Țiglă metalică Kvadro 0,45 mm'],['other','Alt model / se stabilește ulterior']]},
 {key:'price',q:'Care este tariful de vânzare?',opts:settings.roofTariffs.map(v=>[String(v),Number(v).toLocaleString('ro-RO')+' lei/m²']).concat([['custom','Introduc alt tarif']])},
 {key:'payment',q:'Cum achită clientul?',opts:[['cash','Plată integrală'],['installments','Plată în rate']]},
 {key:'months',q:'Pe ce perioadă solicită rate?',opts:[['3','3 luni'],['4','4 luni'],['6','6 luni'],['10','10 luni'],['12','12 luni'],['18','18 luni'],['24','24 luni']]},
 {key:'payer',q:'Cine suportă comisionul finanțării?',opts:[['valmex','VALMEX suportă comisionul'],['client','Clientul suportă comisionul']]},
  {key:'firstPaymentChoice',q:'Clientul achită un avans către VALMEX?',opts:[['no','Nu'],['yes','Da']]},
  {key:'firstPayment',q:'Care este suma avansului?',hint:'Introdu suma avansului achitat direct către VALMEX, în lei.',input:'number',placeholder:'Suma în lei'},
 {key:'clientName',q:'Care este numele clientului?',hint:'Introdu numele și prenumele.',input:'text',placeholder:'Nume și prenume'},
 {key:'clientPhone',q:'La ce număr de telefon contactăm clientul?',hint:'Prefixul +373 este fix. Introdu cele 8 cifre ale numărului din Republica Moldova.',input:'tel',placeholder:'XXXXXXXX'},
 {key:'clientAddress',q:'Unde se află obiectul lucrării?',hint:'Localitate și adresă. Acest câmp poate fi lăsat necompletat.',input:'text',placeholder:'Localitate, stradă...'},
 {key:'extras',q:'Lucrări suplimentare / nestandard',hint:'Adaugă orice lucrare sau material care nu apare în calculator. Fiecare poziție are descriere și preț fix în lei. Prețurile se adună automat la oferta finală.'},
 {key:'confirm',q:'Verifică datele lucrării',hint:'Confirmă pentru a genera oferta clientului și calculul intern.'}
];
let index=0, manualMode=false;
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n||0).toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(n){return fmt(n)+' lei'}
function roofGeometry(){
 const L=Number(state.length)+2*Number(state.eave);
 const W=Number(state.width)+2*Number(state.eave);
 const pitch=Number(state.pitch)*Math.PI/180;
 if(!L||!W||!Number.isFinite(pitch)||Math.cos(pitch)<=0)return null;
 const halfSpan=Math.min(L,W)/2;
 const ridgeLength=Math.max(0,Math.max(L,W)-Math.min(L,W));
 const slopeDepth=halfSpan/Math.cos(pitch);
 const rise=halfSpan*Math.tan(pitch);
 return {L,W,pitch,halfSpan,ridgeLength,slopeDepth,rise};
}
function area(){
 const g=roofGeometry();
 if(!g)return 0;
 if(Number(state.slopes)===2){
  // Doua versante dreptunghiulare, coama pe latura mai lunga.
  return 2*Math.max(g.L,g.W)*g.slopeDepth;
 }
 if(Number(state.slopes)===4){
  // Acoperis in 4 ape: doua trapeze laterale + doua frontoane triunghiulare.
  // Geometria presupune coama paralela cu latura mai lunga si pante egale.
  const longSide=Math.max(g.L,g.W), shortSide=Math.min(g.L,g.W);
  const ridge=Math.max(0,longSide-shortSide);
  const trapezoids=2*((longSide+ridge)/2)*g.slopeDepth;
  const triangles=2*(shortSide*g.slopeDepth/2);
  return trapezoids+triangles;
 }
 return 0;
}
function wood(){
 const g=roofGeometry(), A=area();
 if(!g)return {rafters:0,counter:0,battens:0,total:0};
 const longSide=Math.max(g.L,g.W), shortSide=Math.min(g.L,g.W);
 const sectionRafter=.05*.15, sectionCounter=.05*.03, sectionBatten=.10*.03;
 let rafterLengthTotal=0, counterLengthTotal=0, battenLengthTotal=0;
 if(Number(state.slopes)===2){
  // Perechi de capriori la 80 cm, pe ambele versante.
  const pairs=Math.ceil(longSide/.8)+1;
  rafterLengthTotal=pairs*2*g.slopeDepth;
  counterLengthTotal=rafterLengthTotal;
  const rows=Math.ceil(g.slopeDepth/.30)+1;
  battenLengthTotal=rows*2*longSide;
 }else if(Number(state.slopes)===4){
  // 4 ape: capriori comuni pe cele doua trapeze, capriori scurti pe triunghiuri,
  // plus cei 4 capriori diagonali (solduri). Estimare geometrică, nu proiect structural.
  const ridge=Math.max(0,longSide-shortSide);
  const commonPairs=Math.ceil(ridge/.8)+1;
  const commonLength=commonPairs*2*g.slopeDepth;
  const hipPlan=Math.sqrt((shortSide/2)**2+(shortSide/2)**2);
  const hipLength=Math.sqrt(hipPlan**2+g.rise**2);
  const hipTotal=4*hipLength;
  const endRafters=Math.ceil((shortSide/2)/.8)*2;
  const endCommonLength=endRafters*g.slopeDepth;
  rafterLengthTotal=commonLength+hipTotal+endCommonLength;
  counterLengthTotal=rafterLengthTotal;
  // Sipci estimate pe cele patru fete, pe baza suprafeței reale și pasului de 30 cm.
  battenLengthTotal=A/.30;
 }
 const rafters=rafterLengthTotal*sectionRafter;
 const counter=counterLengthTotal*sectionCounter;
 const battens=battenLengthTotal*sectionBatten;
 return {rafters,counter,battens,total:rafters+counter+battens,
  rafterLengthTotal,counterLengthTotal,battenLengthTotal};
}
function commissions(){return Number(settings.commission[state.months])||0}
function costs(){
  const A=area(),woodVol=wood();
  const roofIncluded=['turnkey'].includes(state.type);
  const tile=(roofIncluded||state.type==='materials')?A*settings.tileCost:0, accessories=roofIncluded?tile*settings.accessoriesPercent/100:0, labor=roofIncluded?A*settings.laborCost:(state.type==='install'?A*settings.laborCost:0), consumables=roofIncluded?settings.consumables:0, woodCost=roofIncluded?woodVol.total*settings.woodCostPerM3:0;
  const beamPerimeter=2*(Number(state.length)+Number(state.width));
  const beamVol=state.beam==='yes'?beamPerimeter*state.beamWidth*state.beamHeight:0;
  const beamCost=beamVol*settings.beamCostPerM3, roofSale=A*Number(state.price);
  const masonryPerimeter=2*(Number(state.length)+Number(state.width));
  const masonryGrossArea=state.masonry==='yes'?masonryPerimeter*(Number(state.masonryHeightCm)/100):0;
  const masonryArea=Math.max(0,masonryGrossArea-Math.max(0,Number(state.openingsArea)||0));
  const blockFaceArea=(Number(settings.blockLengthCm)/100)*(Number(settings.blockHeightCm)/100);
  const blockThickness=Number(settings.blockThicknessCm)/100;
  const masonryVolume=masonryArea*blockThickness;
  const theoreticalBlocks=blockFaceArea>0?Math.ceil(masonryArea/blockFaceArea):0;
  const blockCount=state.masonry==='yes'?Math.ceil(theoreticalBlocks*(1+Number(settings.blockWastePercent)/100)):0;
  const blockCost=blockCount*Math.max(0,Number(state.blockPrice)||0);
  const masonryLaborCost=masonryVolume*Math.max(0,Number(state.masonryLaborRate)||0);
  const masonryCost=state.masonry==='yes'?blockCost+masonryLaborCost:0;
  const slabArea=state.slab==='yes'?Number(state.length)*Number(state.width):0;
  const slabVolume=slabArea*(Math.max(0,Number(state.slabThickness)||0)/100);
  const concreteCost=slabVolume*Math.max(0,Number(state.concretePrice)||0);
  const slabExtras=state.slab==='yes'?(Math.max(0,Number(state.pumpCost)||0)+Math.max(0,Number(state.slabOtherCost)||0)):0;
  const slabCost=state.slab==='yes'?concreteCost+slabExtras:0;
  const baseWorkSale=state.type==='turnkey'?roofSale:(state.type==='install'?A*Number(state.price||0):A*Number(state.price||0));
  const extraTotal=(Array.isArray(state.extraItems)?state.extraItems:[]).reduce((sum,it)=>sum+Math.max(0,Number(it.price)||0),0);
  const sale=baseWorkSale+beamCost+masonryCost+slabCost+extraTotal;
  const commission=state.payment==='installments'?sale*commissions()/100:0;
  const known=tile+accessories+(roofIncluded?labor:state.type==='install'?A*settings.laborCost:0)+consumables+woodCost+beamCost+blockCost+masonryLaborCost+concreteCost+slabExtras+(state.payer==='valmex'?commission:0);
  const clientTotal=sale+(state.payment==='installments'&&state.payer==='client'?commission:0);
  const firstPayment=state.payment==='installments'?Math.max(0,Number(state.firstPayment)||0):0;
  const financedBalance=Math.max(0,clientTotal-firstPayment);
  const monthlyBase=state.payment==='installments'&&Number(state.months)>0?Math.floor((financedBalance/Number(state.months))*100)/100:0;
  const lastMonthly=state.payment==='installments'?Math.round((financedBalance-monthlyBase*(Number(state.months)-1))*100)/100:0;
  return {A,roofSale,sale,extraTotal,tile,accessories,labor,consumables,woodVol,woodCost,beamVol,beamCost,commission,known,clientTotal,remaining:sale-known,beamPerimeter,
    masonryPerimeter,masonryGrossArea,masonryArea,masonryVolume,theoreticalBlocks,blockCount,blockCost,masonryLaborCost,masonryCost,
    slabArea,slabVolume,concreteCost,slabExtras,slabCost,firstPayment,financedBalance,monthlyBase,lastMonthly};
}
function render(){
 $('bar').style.width=(index/(steps.length))*100+'%';
 const s=steps[index]; const stepOptions=s.key==='price'?(state.type==='turnkey'?settings.roofTariffs.map(v=>[String(v),Number(v).toLocaleString('ro-RO')+' lei/m²']).concat([['custom','Introduc alt tarif']]):[['custom',state.type==='install'?'Introduc tariful de montare (lei/m²)':'Introduc tariful materialelor (lei/m²)']]):s.opts; $('result').classList.add('hidden'); $('screen').classList.remove('hidden');
 let question=s.q;if(s.key==='price')question=state.type==='turnkey'?'Care este tariful pentru acoperișul la cheie?':state.type==='install'?'Care este tariful de vânzare pentru montare (lei/m²)?':'Care este tariful de vânzare pentru materiale (lei/m²)?';
 let html=`<div class="stepcount">ÎNTREBAREA ${index+1} DIN ${steps.length}</div><h1>${question}</h1>${s.hint?`<p class="hint">${s.hint}</p>`:''}`;
 if(stepOptions){
  html+='<div class="options">';
  stepOptions.forEach(([v,label])=>html+=`<button class="option" data-value="${v}">${label}</button>`);
  html+='</div>';
 }
 if(s.fields){
  if(s.key==='masonryData'){html+=`<div class="field" style="margin-bottom:14px"><label>Înălțime zidărie (cm)</label><select id="masonryHeightCm">${Array.from({length:25},(_,i)=>(i+1)*20).map(v=>`<option value="${v}" ${Number(state.masonryHeightCm)===v?'selected':''}>${v} cm</option>`).join('')}</select></div>`;}
  html+='<div class="fields">';
  s.fields.forEach(([k,label,type,required=true])=>html+=`<div class="field"><label>${label}</label><input id="f_${k}" type="${type}" min="0" step="any" value="${esc(state[k]??0)}" ${required?"required":""}></div>`);
  html+='</div>';
 }
 if(s.input){
  if(s.key==='clientPhone'){html+=`<div class="fields"><div class="field full"><label>Telefon Moldova</label><div style="display:flex;align-items:center;gap:10px"><strong style="padding:14px;border:1px solid #ddd;border-radius:10px;background:#fff">+373</strong><input id="singleInput" type="tel" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" placeholder="XXXXXXXX" value="${esc(String(state.clientPhone||'').replace(/^\+373/,''))}" style="min-width:0;flex:1;padding:15px;border:1px solid #ddd;border-radius:10px"></div></div></div>`;}else html+=`<div class="fields"><div class="field full"><input id="singleInput" type="${s.input}" placeholder="${s.placeholder||''}" value="${esc(state[s.key]<0?'':(state[s.key]||''))}" autocomplete="on"></div></div>`;
 }
 if(s.key==='extras'){
  const items=Array.isArray(state.extraItems)?state.extraItems:[];
  html+='<div id="extraRows" class="options">';
  items.forEach((it,i)=>{html+=`<div class="panel" style="margin:0"><div class="fields"><div class="field full"><label>Descriere lucrare / material ${i+1}</label><input id="extra_desc_${i}" type="text" maxlength="180" placeholder="Ex.: Demontare acoperiș vechi" value="${esc(it.description||'')}"></div><div class="field"><label>Preț (lei)</label><input id="extra_price_${i}" type="number" min="0" step="0.01" value="${esc(it.price??'')}"></div><div class="field" style="justify-content:end"><button type="button" class="plain-btn" data-remove-extra="${i}">Elimină poziția</button></div></div></div>`;});
  html+='</div><button type="button" class="option" id="addExtra" style="text-align:center;margin-top:12px">+ Adaugă poziție suplimentară</button>';
  const extraSum=items.reduce((a,x)=>a+Math.max(0,Number(x.price)||0),0);
  html+=`<div class="summary" style="margin-top:14px">${row('Total lucrări suplimentare',money(extraSum))}<p class="note">Poți continua fără poziții suplimentare. Acestea vor apărea separat în oferta PDF și vor fi incluse în total.</p></div>`;
 }

 const technical={roof:{type:crmWorkType(),length_m:Number(state.length),width_m:Number(state.width),slopes:Number(state.slopes),pitch_degrees:Number(state.pitch),eave_m:Number(state.eave),area_m2:c.A,tile:state.tile,tariff_m2:Number(state.price),wood_estimate_m3:c.woodVol.total},beam:{included:state.beam==='yes',volume_m3:c.beamVol,cost:c.beamCost,width_m:settings.beamWidth,height_m:settings.beamHeight},masonry:{included:state.masonry==='yes',height_cm:Number(state.masonryHeightCm),area_m2:c.masonryArea,volume_m3:c.masonryVolume,block_count:c.blockCount,block_dimensions_cm:[settings.blockLengthCm,settings.blockHeightCm,settings.blockThicknessCm],block_price:Number(state.blockPrice),labor_rate_m3:Number(state.masonryLaborRate),cost:c.masonryCost},slab:{included:state.slab==='yes',area_m2:c.slabArea,thickness_cm:Number(state.slabThickness),volume_m3:c.slabVolume,concrete_price_m3:Number(state.concretePrice),pump_cost:Number(state.pumpCost),other_cost:Number(state.slabOtherCost),cost:c.slabCost},extras:state.extraItems||[],financial:{total_offer:c.sale,client_total:c.clientTotal,advance_to_valmex:c.firstPayment,financed_balance:c.financedBalance,months:Number(state.months),monthly_payment:c.monthlyBase,last_payment:c.lastMonthly,commission_percent:state.payment==='installments'?commissions():0,commission_amount:c.commission,commission_payer:state.payer,payment:state.payment}};
 const notes=`Ofertă generată în VALMEX LIVE. Total: ${fmt(c.clientTotal)} lei. ${state.payment==='installments'?`Avans VALMEX: ${fmt(c.firstPayment)} lei. Sold finanțat: ${fmt(c.financedBalance)} lei. ${state.months} rate; rată lunară ${fmt(c.monthlyBase)} lei; ultima ${fmt(c.lastMonthly)} lei. Comision finanțare suportat de ${state.payer==='valmex'?'VALMEX':'client'}.`:'Plată integrală.'}`;
 return {p_client:{phone:'+373'+phone.slice(3),first_name:name.first_name,last_name:name.last_name,email:state.clientEmail||null,region:null,locality,address:address||null,work_type:crmWorkType()},p_project:{title:`${crmWorkType()} – ${state.clientName}`,work_type:crmWorkType(),address:address||null},p_measurement:{work_type:crmWorkType(),length_m:Number(state.length),width_m:Number(state.width),height_m:state.masonry==='yes'?Number(state.masonryHeightCm)/100:null,area_m2:c.A,slope_degrees:Number(state.pitch),technical_details:technical,notes},p_quotation:{title:`Ofertă ${crmWorkType()} – ${state.clientName}`,status:'ciorna',valid_until:null,discount_percent:0,notes,terms:state.payment==='installments'?`Avans către VALMEX: ${fmt(c.firstPayment)} lei. Sold finanțat: ${fmt(c.financedBalance)} lei în ${state.months} rate către compania de finanțare.`:'Plată integrală.'},p_items:crmItems(c)};

async function makeClientPdfBlob(){
 if(!window.html2pdf)throw new Error('Modulul PDF nu s-a încărcat. Verifică conexiunea la internet și încearcă din nou.');
 makePdf('client',false);
 const source=$('printdoc');
 if(!source||!source.innerHTML.trim())throw new Error('Conținutul ofertei PDF este gol.');
 const wrap=document.createElement('div');
 wrap.style.cssText='position:fixed;left:0;top:0;width:190mm;min-height:20mm;z-index:2147483647;background:#fff;color:#171717;padding:8mm;font-family:Arial,sans-serif;display:block;visibility:visible;';
 wrap.innerHTML=source.innerHTML;
 document.body.appendChild(wrap);
 try{
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const blob=await window.html2pdf().set({
   margin:8,
   filename:'oferta-valmex.pdf',
   image:{type:'jpeg',quality:.96},
   html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,windowWidth:Math.max(document.documentElement.clientWidth,wrap.scrollWidth)},
   jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
  }).from(wrap).outputPdf('blob');
  if(!blob||blob.size<5000)throw new Error('PDF-ul generat este gol sau incomplet. Nu a fost încărcat în CRM.');
  return blob;
 }finally{wrap.remove();}
}
async function uploadClientPdf(result){const {data:{user},error:userError}=await crmDb.auth.getUser();if(userError||!user)throw new Error('Sesiunea CRM a expirat. Autentifică-te din nou.');const blob=await makeClientPdfBlob();const path=`clients/${result.client_id}/projects/${result.project_id}/${result.quotation_code}-oferta-client.pdf`;const {error:uploadError}=await crmDb.storage.from('valmex-clienti').upload(path,blob,{contentType:'application/pdf',upsert:true});if(uploadError)throw new Error('Oferta a fost salvată în CRM, dar PDF-ul nu a putut fi încărcat: '+uploadError.message);const {error:docError}=await crmDb.from('documents').insert({client_id:result.client_id,project_id:result.project_id,file_name:`${result.quotation_code}-oferta-client.pdf`,storage_path:path,category:'oferta_client',uploaded_by:user.id});if(docError)throw new Error('PDF-ul a fost încărcat, dar înregistrarea documentului a eșuat: '+docError.message);crmPdfUploaded=true;}
async function addToCrm(){if(crmSaveBusy)return;const button=$('saveToCrm');if(!button)return;crmSaveBusy=true;button.disabled=true;button.textContent='Se salvează în CRM...';try{
 if(!crmDb)crmDb=crmClient();if(!crmDb){window.location.href='index.html';return;}
 const {data:{session},error:sessionError}=await crmDb.auth.getSession();if(sessionError||!session)throw new Error('Nu există o sesiune CRM activă. Autentifică-te în CRM, apoi redeschide calculatorul.');
 const {data:profile,error:profileError}=await crmDb.from('profiles').select('id,role,active').eq('id',session.user.id).maybeSingle();if(profileError||!profile||profile.active!==true)throw new Error('Contul nu este activ sau profilul CRM nu este configurat.');
 if(!crmSaveResult){const payload=crmPayload();const {data,error}=await crmDb.rpc('valmex_live_save_offer',payload);if(error)throw new Error(error.message);crmSaveResult=Array.isArray(data)?data[0]:data;if(!crmSaveResult?.success||!crmSaveResult.client_id||!crmSaveResult.project_id||!crmSaveResult.quotation_id)throw new Error('CRM nu a confirmat salvarea completă.');}
 if(!crmPdfUploaded)await uploadClientPdf(crmSaveResult);
 crmFeedback(`Salvat cu succes: client ${crmSaveResult.client_code}, proiect ${crmSaveResult.project_code}, măsurătoare ${crmSaveResult.measurement_code}, ofertă ${crmSaveResult.quotation_code}. PDF-ul clientului este atașat în dosar.`);
 button.textContent='Salvat în CRM ✓';button.disabled=true;
 const link=document.createElement('a');link.href=`https://valmex.md/Crm/clienti.html?phone=${encodeURIComponent(state.clientPhone)}`;link.textContent='Deschide clientul în CRM';link.style.cssText='display:inline-block;margin-top:10px;color:#e30613;font-weight:700';$('crmFeedback').appendChild(document.createElement('br'));$('crmFeedback').appendChild(link);
 }catch(error){crmFeedback('Nu s-a finalizat integrarea: '+(error.message||error));button.textContent=crmSaveResult?'Reîncarcă PDF-ul în dosar':'Încearcă din nou';button.disabled=false;}finally{crmSaveBusy=false;}}

  ${state.slab==='yes'?row('Cost total planșeu',money(c.slabCost)):''}

 ${row('Valoare totală ofertă',money(c.sale))}
 ${kind==='client'?row('Total achitat de client',money(c.clientTotal)):''}
 ${kind==='client'&&state.payment==='installments'&&state.payer==='client'?row('Comision finanțare',money(c.commission)):''}

 </div>${Number(state.slopes)===4?'<p>Acoperiș în 4 ape: calcul geometric separat pentru două versante trapezoidale și două triunghiulare. Suprafața poate coincide cu cea a unui acoperiș în 2 ape la aceeași amprentă și aceeași înclinație. Cantitățile de lemn sunt estimative și trebuie verificate la măsurători.</p>':''}`;
 if(kind==='internal'){
