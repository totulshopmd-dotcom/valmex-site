<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>VALMEX | Chat CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0f13;--p:#171b22;--p2:#222832;--line:#303844;--txt:#f2f4f7;--muted:#9ba5b3;--red:#d83232;--green:#23845b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,Arial}button,input,select,textarea{font:inherit}.top{height:60px;background:#111419;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:3}.logo{font-weight:900;letter-spacing:1px}.logo b{color:var(--red)}#identity{font-size:12px;color:var(--muted)}.layout{height:calc(100dvh - 60px);display:grid;grid-template-columns:310px minmax(360px,1fr) minmax(280px,340px)}.inbox{background:var(--p);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.ih{padding:16px;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0 0 12px}.search{width:100%;padding:11px;background:#101319;border:1px solid var(--line);border-radius:8px;color:white}.filters{display:flex;gap:5px;padding:10px;overflow:auto;border-bottom:1px solid var(--line)}.filter{white-space:nowrap;background:none;border:1px solid var(--line);border-radius:20px;color:var(--muted);padding:6px 9px;font-size:11px}.filter.active{background:#512525;color:white}.list{overflow:auto;flex:1}.item{padding:13px;border-bottom:1px solid #29303a;cursor:pointer}.item.active,.item:hover{background:#252c36}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:700}.time,.preview{font-size:11px;color:var(--muted)}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;background:#303844;border-radius:12px;padding:3px 7px;margin:7px 4px 0 0;font-size:10px}.tag.red{background:#602727}.tag.green{background:#1d4939}.chat{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}.head{padding:13px 16px;background:var(--p);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.client{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:3px}.controls{display:flex;gap:7px;flex-wrap:wrap}.ctrl{background:#101319;border:1px solid var(--line);border-radius:7px;color:white;padding:8px;max-width:190px}.modebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#14181f;border-bottom:1px solid var(--line)}.mode-state{font-size:11px;color:var(--muted);margin-right:auto}.action{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#242b35;color:#fff;cursor:pointer;font-size:12px}.action.primary{background:#512525;border-color:#744040}.action.safe{background:#204936;border-color:#326e50}.action:disabled{opacity:.5;cursor:wait}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.msg{max-width:82%;background:#252d38;border-radius:11px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start;line-height:1.45}.msg.op{align-self:flex-end;background:#542525}.msg.ai{border-left:3px solid #d83232;background:#232933}.msg.note{align-self:flex-end;background:#51401f}.mm{font-size:10px;color:#c4cbd4;margin-bottom:5px}.attachment-link{display:inline-flex;margin-top:7px;padding:9px 12px;border:1px solid #d83232;border-radius:8px;color:#f4b3b3;text-decoration:none;font-weight:700;font-size:12px}.attachment-link:hover{background:#392126}.composer{padding:12px;background:var(--p);border-top:1px solid var(--line)}.modes{display:flex;gap:6px;margin-bottom:8px}.modes button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 9px;cursor:pointer}.modes button.active{border-color:var(--red);color:white}.compose{display:flex;gap:8px}.compose textarea{flex:1;min-height:48px;max-height:130px;resize:vertical;background:#101319;border:1px solid var(--line);border-radius:8px;color:white;padding:11px}.btn{background:var(--red);border:0;color:white;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.report{background:#12161d;overflow:auto;padding:14px}.report h2{font-size:16px;margin:2px 0 12px;display:flex;align-items:center;gap:8px}.report-card{background:#1a2029;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}.report-status{font-size:11px;color:var(--muted);margin-bottom:8px}.report-summary{font-size:13px;line-height:1.5;white-space:pre-wrap}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.field{background:#11151b;border-radius:7px;padding:8px;min-width:0}.field small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.field span{font-size:12px;overflow-wrap:anywhere}.field input{width:100%;box-sizing:border-box;background:#1a2029;border:1px solid var(--line);border-radius:6px;padding:9px;color:var(--text);font:inherit;font-size:13px;outline:none}.field input:focus{border-color:#d83232}.report ul{margin:7px 0 0;padding-left:18px;font-size:12px;line-height:1.55}.report h3{font-size:12px;margin:14px 0 4px}.empty,.loading{color:var(--muted);text-align:center;padding:25px;margin:auto}.notice{padding:10px;background:#3c2c18;color:#f2d49a;margin:10px;border-radius:7px;display:none}.back{display:none}
@media(max-width:1050px){.layout{grid-template-columns:270px minmax(320px,1fr)}.report{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);max-height:290px}.report h2{grid-column:1/-1;margin:0}.report-card{margin:0;overflow:auto}}
@media(max-width:720px){.layout{display:block;height:calc(100dvh - 60px)}.inbox{height:100%}.chat{display:none;height:100%;border:0}.report{display:none}.layout.open .inbox{display:none}.layout.open .chat{display:flex}.layout.report-open .chat{display:none}.layout.report-open .report{display:block;height:calc(100dvh - 60px);max-height:none;overflow:auto}.back{display:inline-block;background:#303844;color:white;border:0;border-radius:6px;padding:7px;margin-right:8px}.msg{max-width:92%}.ctrl{flex:1;max-width:none}.modebar{padding:8px}.mode-state{width:100%}}
</style></head><body>
<header class="top"><div style="display:flex;align-items:center;gap:12px"><div class="logo">VALMEX<b>.</b> <span style="font-size:11px;color:#9ba5b3;font-weight:400">CRM · CHAT AI</span></div></div><span id="identity">Verificare sesiune…</span></header>
<div class="layout" id="layout"><aside class="inbox"><div class="ih"><h1>Conversații</h1><input class="search" id="search" placeholder="Caută client sau mesaj…"></div>
<nav class="filters" id="filters"><button class="filter active" data-s="">Toate</button><button class="filter" data-s="nou">Noi</button><button class="filter" data-s="nealocat">Nealocate</button><button class="filter" data-s="alocat">Alocate</button><button class="filter" data-s="in_lucru">În lucru</button><button class="filter" data-s="asteapta_client">Așteaptă client</button></nav><div class="notice" id="notice"></div><div class="list" id="list"><div class="loading">Se încarcă…</div></div></aside>
<main class="chat"><div class="head" id="head"><div class="empty">Selectează o conversație.</div></div>
<div class="modebar" id="modebar" hidden><span class="mode-state" id="modeState"></span><button class="action primary" id="toggleMode"></button><button class="action" id="showReport">Fișa raportului</button><button class="action" id="generateReport">Generează raport AI</button></div>
<div class="messages" id="messages"><div class="empty">Mesajele vor apărea aici.</div></div>
<div class="composer" id="composer" style="display:none"><div class="modes"><button class="active" data-mode="public">Răspuns client</button><button data-mode="internal">Notă internă</button></div><div class="compose"><textarea id="input" placeholder="Scrie mesajul…"></textarea><button class="btn" id="send">Trimite</button></div></div></main>
<aside class="report" id="reportPanel"><h2><button class="back" id="reportBack" type="button">←</button>Fișa conversației</h2><div class="report-card" id="reportBody"><div class="empty">Selectează o conversație pentru a vedea raportul.</div></div></aside></div>
<script>
(()=>{'use strict';
const URL='https://qejnbbzhpvfjeqzwotwt.supabase.co',KEY='sb_publishable_xbF3ggFeZ475werOTmFWvA_Ho_cxYov',SK='sb-qejnbbzhpvfjeqzwotwt-auth-token',API=URL+'/functions/v1/valmex-chat-api';
const $=x=>document.getElementById(x),sb=window.supabase.createClient(URL,KEY,{auth:{storage:localStorage.getItem(SK)?localStorage:sessionStorage,storageKey:SK,persistSession:true,autoRefreshToken:true}});
let session,me,rows=[],current=null,filter='',mode='public',operators=[],refreshTimer=null;
const labels={nou:'Nouă',nealocat:'Nealocată',alocat:'Alocată',in_lucru:'În lucru',asteapta_client:'Așteaptă client',escaladat:'Escaladat',inchis:'Închisă'};
const fields=[['service','Serviciu'],['client_name','Client'],['phone','Telefon'],['email','Email'],['region','Raion / regiune'],['locality','Localitate'],['address','Adresă'],['work_type','Tip lucrare'],['dimensions','Dimensiuni'],['roof_type','Tip acoperiș'],['material','Material'],['building_details','Detalii construcție'],['budget','Buget'],['timing','Termen dorit']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>s?new Date(s).toLocaleString('ro-MD',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
function alertMsg(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',6000)}
async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});let j={};try{j=await r.json()}catch{}if(!r.ok||j.error)throw Error(j.error||'Eroare server');return j}
async function start(){try{const x=await sb.auth.getSession();session=x.data.session;if(!session)throw Error('Nu există sesiune CRM. Autentifică-te în CRM și redeschide pagina.');const p=await sb.from('profiles').select('id,full_name,role,active').eq('id',session.user.id).maybeSingle();if(p.error||!p.data||!p.data.active)throw Error('Cont inactiv sau fără acces.');me=p.data;$('identity').textContent=(me.full_name||'Operator')+' · '+me.role;const op=await sb.from('profiles').select('id,full_name,role').eq('active',true).order('full_name');if(op.error)throw op.error;operators=op.data||[];await inbox();refreshTimer=setInterval(async()=>{try{await inbox();if(current){await messages();await loadReport()}}catch(e){console.warn('Chat CRM refresh',e)}},12000)}catch(e){alertMsg(e.message);$('list').innerHTML='<div class="loading">'+esc(e.message)+'</div>'}}
async function inbox(){const j=await call('staff_inbox',{status:filter});rows=j.conversations||[];drawList();if(current){const n=rows.find(x=>x.id===current.id);if(n){current=n;head()}else{current=null;emptyChat()}}}
function drawList(){const q=$('search').value.toLowerCase().trim(),a=rows.filter(c=>[c.visitor_name,c.visitor_phone,c.visitor_email,c.last_message_preview].join(' ').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(c=>`<div class="item ${current?.id===c.id?'active':''}" data-id="${esc(c.id)}"><div class="row"><span class="name">${esc(c.visitor_name||'Vizitator')}</span><span class="time">${esc(dt(c.last_message_at||c.created_at))}</span></div><div class="preview">${esc(c.last_message_preview||'Conversație nouă')}</div><span class="tag ${c.status==='nou'?'red':''}">${esc(labels[c.status]||c.status)}</span>${c.response_mode==='human'?'<span class="tag red">Operator</span>':'<span class="tag green">AI</span>'}${c.staff_unread_count?'<span class="tag red">Necitite</span>':''}</div>`).join(''):'<div class="loading">Nu există conversații.</div>';$('list').querySelectorAll('.item').forEach(n=>n.onclick=()=>open(n.dataset.id))}
function emptyChat(){$('head').innerHTML='<div class="empty">Selectează o conversație.</div>';$('messages').innerHTML='<div class="empty">Mesajele vor apărea aici.</div>';$('composer').style.display='none';$('modebar').hidden=true;$('reportBody').innerHTML='<div class="empty">Selectează o conversație pentru a vedea raportul.</div>'}
async function open(id){current=rows.find(x=>x.id===id);if(!current)return;$('layout').classList.remove('report-open');$('layout').classList.add('open');drawList();head();$('composer').style.display='block';$('modebar').hidden=false;try{await messages();await loadReport();await inbox()}catch(e){alertMsg(e.message)}}
function head(){if(!current)return;const opts=operators.map(o=>`<option value="${esc(o.id)}" ${o.id===current.assigned_to?'selected':''}>${esc(o.full_name||o.role)}</option>`).join('');$('head').innerHTML=`<div><button class="back" id="back">←</button><span class="client">${esc(current.visitor_name||'Vizitator')}</span><div class="meta">${esc(current.visitor_phone||'Fără telefon')} · ${esc(current.visitor_email||'Fără email')} · ${esc(labels[current.status]||current.status)}</div></div><div class="controls"><select class="ctrl" id="assign"><option value="">Nealocată</option>${opts}</select><select class="ctrl" id="status">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${current.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`;$('back')?.addEventListener('click',()=>$('layout').classList.remove('open'));$('assign').onchange=async e=>{try{await call('assign',{conversation_id:current.id,assigned_to:e.target.value||null});await inbox()}catch(x){alertMsg(x.message)}};$('status').onchange=async e=>{const nextStatus=e.target.value,conversationId=current?.id;if(!conversationId)return;try{await call('set_status',{conversation_id:conversationId,status:nextStatus});await inbox();if(nextStatus==='inchis'){try{const generated=await call('staff_generate_report',{conversation_id:conversationId});renderReport(generated.report);$('layout').classList.add('report-open');alertMsg('Conversația a fost închisă. Fișa AI a fost generată automat.')}catch(reportError){alertMsg('Conversația a fost închisă, dar fișa AI nu a putut fi generată: '+reportError.message)}}}catch(x){alertMsg(x.message)}};const human=current.response_mode==='human';$('modeState').textContent=human?'AI oprit · conversația este preluată de operator':'AI activ · operatorul poate monitoriza conversația';$('toggleMode').textContent=human?'Reactivează AI':'Preiau conversația — opresc AI';$('toggleMode').className='action '+(human?'safe':'primary');$('toggleMode').onclick=toggleMode}
async function toggleMode(){if(!current)return;const next=current.response_mode==='human'?'ai':'human';$('toggleMode').disabled=true;try{await call('set_response_mode',{conversation_id:current.id,response_mode:next});await inbox();await messages()}catch(e){alertMsg(e.message)}finally{$('toggleMode').disabled=false}}
function senderLabel(t,v){return t==='visitor'?'CLIENT':t==='operator'?'CONSULTANT VALMEX':t==='ai'?'ASISTENT VALMEX':t==='system'?'SISTEM':v==='internal'?'NOTĂ INTERNĂ':'MESAJ'}
async function messages(){if(!current)return;const j=await call('staff_messages',{conversation_id:current.id}),a=j.messages||[];$('messages').innerHTML=a.length?a.map(m=>`<div class="msg ${m.visibility==='internal'?'note':m.sender_type==='operator'?'op':m.sender_type==='ai'?'ai':''}"><div class="mm">${senderLabel(m.sender_type,m.visibility)} · ${esc(dt(m.created_at))}</div>${m.message_type==='attachment'?(m.attachment_url?`<a class="attachment-link" href="${esc(m.attachment_url)}" target="_blank" rel="noopener">Descarcă oferta PDF</a>`:'Fișier PDF indisponibil temporar'):esc(m.body||'')}</div>`).join(''):'<div class="empty">Nu există mesaje.</div>';$('messages').scrollTop=$('messages').scrollHeight}
function listHTML(items){return Array.isArray(items)&&items.length?'<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="report-status">Nu au fost indicate.</div>'}
function renderReport(report){if(!report){$('reportBody').innerHTML='<div class="empty">Nu există raport. La închiderea conversației, fișa AI se generează automat. O poți genera și manual.</div>';return}const d=report.report_data||{};const fullName=String(d.client_name||current?.visitor_name||'').trim().split(/\s+/);const first=fullName.shift()||'';const last=fullName.join(' ');const phone=String(d.phone||current?.visitor_phone||'');const locality=String(d.locality||'');const linked=!!report.client_id;$('reportBody').innerHTML=`<div class="report-status">${report.report_status==='reviewed'?'Verificat de operator':'Ciornă generată de AI'} · ${esc(dt(report.generated_at))}</div><div class="report-summary">${esc(report.summary||d.summary||'Fără rezumat')}</div><div class="report-grid">${fields.map(([k,label])=>`<div class="field"><small>${label}</small><span>${esc(d[k]||'Necompletat')}</span></div>`).join('')}</div><h3>Informații lipsă</h3>${listHTML(report.missing_information||d.missing_information)}<h3>Pași recomandați</h3>${listHTML(report.recommended_next_steps||d.recommended_next_steps)}<button class="btn" id="reviewReport" style="width:100%;margin-top:12px" ${report.report_status==='reviewed'?'disabled':''}>${report.report_status==='reviewed'?'Raport verificat':'Confirmă verificarea raportului'}</button><h3 style="margin-top:18px">Înregistrare în CRM – Clienți</h3>${linked?'<div class="report-status">Clientul este deja înregistrat și asociat acestei conversații.</div>':'<div class="field"><small>Prenume *</small><input id="crmFirstName" value="'+esc(first)+'" autocomplete="given-name"></div><div class="field"><small>Nume *</small><input id="crmLastName" value="'+esc(last)+'" autocomplete="family-name"></div><div class="field"><small>Telefon *</small><input id="crmPhone" value="'+esc(phone)+'" autocomplete="tel"></div><div class="field"><small>Localitate</small><input id="crmLocality" value="'+esc(locality)+'"></div><button class="btn" id="convertClient" style="width:100%;margin-top:12px">Adaugă în Clienți</button>'}`;$('reviewReport')?.addEventListener('click',async()=>{try{await call('staff_review_report',{report_id:report.id});await loadReport();alertMsg('Raportul a fost marcat ca verificat.')}catch(e){alertMsg(e.message)}});$('convertClient')?.addEventListener('click',async()=>{const button=$('convertClient');button.disabled=true;button.textContent='Se înregistrează…';try{const result=await call('staff_convert_report_to_client',{report_id:report.id,first_name:$('crmFirstName').value.trim(),last_name:$('crmLastName').value.trim(),phone:$('crmPhone').value.trim(),locality:$('crmLocality').value.trim()});await loadReport(report.conversation_id);alertMsg('Clientul '+result.client.client_code+' a fost adăugat în CRM și asociat conversației.')}catch(e){alertMsg(e.message);button.disabled=false;button.textContent='Adaugă în Clienți'}})}
async function loadReport(conversationId=current?.id){if(!conversationId)return;const j=await call('staff_get_report',{conversation_id:conversationId});renderReport(j.report)}
async function generateReport(){if(!current)return;$('generateReport').disabled=true;$('generateReport').textContent='Se analizează…';try{const j=await call('staff_generate_report',{conversation_id:current.id});renderReport(j.report);alertMsg('Raportul a fost generat. Verifică informațiile înainte de a le folosi.')}catch(e){alertMsg(e.message)}finally{$('generateReport').disabled=false;$('generateReport').textContent='Generează raport AI'}}
async function send(){const msg=$('input').value.trim();if(!current||!msg)return;$('send').disabled=true;try{await call(mode==='internal'?'internal_note':'staff_send',{conversation_id:current.id,message:msg});$('input').value='';await messages();await inbox()}catch(e){alertMsg(e.message)}finally{$('send').disabled=false}}
$('send').onclick=send;$('generateReport').onclick=generateReport;$('showReport').onclick=()=>$('layout').classList.add('report-open');$('reportBack').onclick=()=>$('layout').classList.remove('report-open');$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('input').placeholder=mode==='internal'?'Notă vizibilă doar în CRM…':'Scrie răspunsul pentru client…'});$('filters').onclick=async e=>{const b=e.target.closest('[data-s]');if(!b)return;filter=b.dataset.s;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));try{await inbox()}catch(x){alertMsg(x.message)}};$('search').oninput=drawList;start();
})();
</script><script src="components/persistent-nav.js"></script>
<script src="onesignal-auth.js?v=1" defer></script>
</body></html>
