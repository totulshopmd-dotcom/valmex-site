<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>VALMEX | Chat CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0f13;--p:#171b22;--p2:#222832;--line:#303844;--txt:#f2f4f7;--muted:#9ba5b3;--red:#d83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,Arial}.top{height:60px;background:#111419;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:3}.logo{font-weight:900;letter-spacing:1px}.logo b{color:var(--red)}#identity{font-size:12px;color:var(--muted)}button,input,select,textarea{font:inherit}.layout{height:calc(100dvh - 60px);display:grid;grid-template-columns:340px 1fr}.inbox{background:var(--p);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.ih{padding:16px;border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0 0 12px}.search{width:100%;padding:11px;background:#101319;border:1px solid var(--line);border-radius:8px;color:white}.filters{display:flex;gap:5px;padding:10px;overflow:auto;border-bottom:1px solid var(--line)}.filter{white-space:nowrap;background:none;border:1px solid var(--line);border-radius:20px;color:var(--muted);padding:6px 9px;font-size:11px}.filter.active{background:#512525;color:white}.list{overflow:auto;flex:1}.item{padding:13px;border-bottom:1px solid #29303a;cursor:pointer}.item.active,.item:hover{background:#252c36}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:700}.time,.preview{font-size:11px;color:var(--muted)}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{display:inline-block;background:#303844;border-radius:12px;padding:3px 7px;margin:7px 4px 0 0;font-size:10px}.tag.red{background:#602727}.chat{display:flex;flex-direction:column;min-width:0;min-height:0}.head{padding:13px 16px;background:var(--p);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.client{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:3px}.controls{display:flex;gap:7px;flex-wrap:wrap}.ctrl{background:#101319;border:1px solid var(--line);border-radius:7px;color:white;padding:8px;max-width:190px}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.msg{max-width:78%;background:#252d38;border-radius:11px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}.msg.op{align-self:flex-end;background:#542525}.msg.note{align-self:flex-end;background:#51401f}.mm{font-size:10px;color:#c4cbd4;margin-bottom:5px}.composer{padding:12px;background:var(--p);border-top:1px solid var(--line)}.modes{display:flex;gap:6px;margin-bottom:8px}.modes button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 9px}.modes button.active{border-color:var(--red);color:white}.compose{display:flex;gap:8px}.compose textarea{flex:1;min-height:48px;max-height:130px;resize:vertical;background:#101319;border:1px solid var(--line);border-radius:8px;color:white;padding:11px}.btn{background:var(--red);border:0;color:white;border-radius:8px;padding:10px 16px;font-weight:700}.btn.secondary{background:#303844}.empty,.loading{color:var(--muted);text-align:center;padding:25px;margin:auto}.notice{padding:10px;background:#3c2c18;color:#f2d49a;margin:10px;border-radius:7px;display:none}.back{display:none}
@media(max-width:720px){.layout{display:block}.inbox{height:100%}.chat{display:none;height:100%}.layout.open .inbox{display:none}.layout.open .chat{display:flex}.back{display:inline-block;background:#303844;color:white;border:0;border-radius:6px;padding:7px;margin-right:8px}.msg{max-width:90%}.ctrl{flex:1;max-width:none}}
</style></head><body>
<header class="top"><div class="logo">VALMEX<b>.</b> <span style="font-size:11px;color:#9ba5b3;font-weight:400">CRM · CHAT</span></div><span id="identity">Verificare sesiune…</span></header>
<div class="layout" id="layout"><aside class="inbox"><div class="ih"><h1>Conversații</h1><input class="search" id="search" placeholder="Caută client sau mesaj…"></div>
<nav class="filters" id="filters"><button class="filter active" data-s="">Toate</button><button class="filter" data-s="nou">Noi</button><button class="filter" data-s="nealocat">Nealocate</button><button class="filter" data-s="alocat">Alocate</button><button class="filter" data-s="in_lucru">În lucru</button><button class="filter" data-s="asteapta_client">Așteaptă client</button></nav><div class="notice" id="notice"></div><div class="list" id="list"><div class="loading">Se încarcă…</div></div></aside>
<main class="chat"><div class="head" id="head"><div class="empty">Selectează o conversație.</div></div><div class="messages" id="messages"><div class="empty">Mesajele vor apărea aici.</div></div>
<div class="composer" id="composer" style="display:none"><div class="modes"><button class="active" data-mode="public">Răspuns client</button><button data-mode="internal">Notă internă</button></div><div class="compose"><textarea id="input" placeholder="Scrie mesajul…"></textarea><button class="btn" id="send">Trimite</button></div></div></main></div>
<script>
(()=>{'use strict';
const URL='https://qejnbbzhpvfjeqzwotwt.supabase.co',KEY='sb_publishable_xbF3ggFeZ475werOTmFWvA_Ho_cxYov',SK='sb-qejnbbzhpvfjeqzwotwt-auth-token',API=URL+'/functions/v1/valmex-chat-api';
const $=x=>document.getElementById(x),sb=window.supabase.createClient(URL,KEY,{auth:{storage:localStorage.getItem(SK)?localStorage:sessionStorage,storageKey:SK,persistSession:true,autoRefreshToken:true}});
let session,me,rows=[],current=null,filter='',mode='public',operators=[];
const labels={nou:'Nouă',nealocat:'Nealocată',alocat:'Alocată',in_lucru:'În lucru',asteapta_client:'Așteaptă client',escaladat:'Escaladat',inchis:'Închisă'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>s?new Date(s).toLocaleString('ro-MD',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
function alertMsg(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',5000)}
async function call(action,extra={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...extra})});let j={};try{j=await r.json()}catch{}if(!r.ok||j.error)throw Error(j.error||'Eroare server');return j}
async function start(){try{let x=await sb.auth.getSession();session=x.data.session;if(!session)throw Error('Nu există sesiune CRM. Autentifică-te în CRM și redeschide pagina.');let p=await sb.from('profiles').select('id,full_name,role,active').eq('id',session.user.id).maybeSingle();if(p.error||!p.data||!p.data.active)throw Error('Cont inactiv sau fără acces.');me=p.data;$('identity').textContent=(me.full_name||'Operator')+' · '+me.role;let op=await sb.from('profiles').select('id,full_name,role').eq('active',true).order('full_name');if(op.error)throw op.error;operators=op.data||[];await inbox()}catch(e){alertMsg(e.message);$('list').innerHTML='<div class="loading">'+esc(e.message)+'</div>'}}
async function inbox(){let j=await call('staff_inbox',{status:filter});rows=j.conversations||[];drawList();if(current){let n=rows.find(x=>x.id===current.id);if(n)current=n;else{current=null;emptyChat()}}}
function drawList(){let q=$('search').value.toLowerCase().trim(),a=rows.filter(c=>[c.visitor_name,c.visitor_phone,c.visitor_email,c.last_message_preview].join(' ').toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(c=>`<div class="item ${current?.id===c.id?'active':''}" data-id="${esc(c.id)}"><div class="row"><span class="name">${esc(c.visitor_name||'Vizitator')}</span><span class="time">${esc(dt(c.last_message_at||c.created_at))}</span></div><div class="preview">${esc(c.last_message_preview||'Conversație nouă')}</div><span class="tag ${c.status==='nou'?'red':''}">${esc(labels[c.status]||c.status)}</span>${c.staff_unread_count?'<span class="tag red">Necitite</span>':''}</div>`).join(''):'<div class="loading">Nu există conversații.</div>';$('list').querySelectorAll('.item').forEach(n=>n.onclick=()=>open(n.dataset.id))}
function emptyChat(){$('head').innerHTML='<div class="empty">Selectează o conversație.</div>';$('messages').innerHTML='<div class="empty">Mesajele vor apărea aici.</div>';$('composer').style.display='none'}
async function open(id){current=rows.find(x=>x.id===id);if(!current)return;$('layout').classList.add('open');drawList();head();$('composer').style.display='block';try{await messages();await inbox();head()}catch(e){alertMsg(e.message)}}
function head(){if(!current)return;let opts=operators.map(o=>`<option value="${esc(o.id)}" ${o.id===current.assigned_to?'selected':''}>${esc(o.full_name||o.role)}</option>`).join('');$('head').innerHTML=`<div><button class="back" id="back">←</button><span class="client">${esc(current.visitor_name||'Vizitator')}</span><div class="meta">${esc(current.visitor_phone||'Fără telefon')} · ${esc(current.visitor_email||'Fără email')}</div></div><div class="controls"><select class="ctrl" id="assign"><option value="">Nealocată</option>${opts}</select><select class="ctrl" id="status">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${current.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`;$('back')?.addEventListener('click',()=>$('layout').classList.remove('open'));$('assign').onchange=async e=>{try{await call('assign',{conversation_id:current.id,assigned_to:e.target.value||null});await inbox();current=rows.find(x=>x.id===id)||current;head()}catch(x){alertMsg(x.message)}};$('status').onchange=async e=>{try{await call('set_status',{conversation_id:current.id,status:e.target.value});current.status=e.target.value;await inbox();head()}catch(x){alertMsg(x.message)}}}
async function messages(){let j=await call('staff_messages',{conversation_id:current.id}),a=j.messages||[];$('messages').innerHTML=a.length?a.map(m=>`<div class="msg ${m.visibility==='internal'?'note':m.sender_type==='operator'?'op':''}"><div class="mm">${m.visibility==='internal'?'NOTĂ INTERNĂ':m.sender_type==='operator'?'VALMEX':'CLIENT'} · ${esc(dt(m.created_at))}</div>${esc(m.body||'')}</div>`).join(''):'<div class="empty">Nu există mesaje.</div>';$('messages').scrollTop=$('messages').scrollHeight}
async function send(){let msg=$('input').value.trim();if(!current||!msg)return;$('send').disabled=true;try{await call(mode==='internal'?'internal_note':'staff_send',{conversation_id:current.id,message:msg});$('input').value='';await messages();await inbox();current=rows.find(x=>x.id===current.id)||current;head()}catch(e){alertMsg(e.message)}finally{$('send').disabled=false}}
$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('input').placeholder=mode==='internal'?'Notă vizibilă doar în CRM…':'Scrie răspunsul pentru client…'});$('filters').onclick=async e=>{let b=e.target.closest('[data-s]');if(!b)return;filter=b.dataset.s;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));try{await inbox()}catch(x){alertMsg(x.message)}};$('search').oninput=drawList;start();
})();
</script></body></html>
