<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALMEX – Calculator LIVE</title>
<style>
:root{--red:#e30613;--ink:#171717;--muted:#737373;--line:#e8e8e8;--bg:#f5f5f5;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:900;letter-spacing:.5px;font-size:21px}.brand span{color:var(--red)}.top small{color:var(--muted)}
.dashboard-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #e8e8e8;background:#fff;color:#171717;border-radius:10px;width:38px;height:38px;padding:0;font-weight:800;font-size:20px;white-space:nowrap}.dashboard-link:hover{border-color:#e30613;color:#e30613}
main{width:min(680px,100%);margin:0 auto;padding:28px 18px 110px;flex:1;display:flex;flex-direction:column}
.live-tag{font-size:11px;letter-spacing:1.5px;color:var(--red);font-weight:800;margin:16px 0 14px}
.progress{height:3px;background:#e6e6e6;border-radius:9px;overflow:hidden;margin-bottom:34px}.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}
.stepcount{font-size:12px;color:var(--muted);margin-bottom:10px}
h1{font-size:clamp(25px,5vw,34px);line-height:1.15;margin:0 0 24px;letter-spacing:-.7px}
.hint{font-size:14px;color:var(--muted);line-height:1.5;margin:-12px 0 22px}
.options{display:grid;gap:10px}
.option{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 18px;text-align:left;font-weight:700;color:var(--ink);transition:.15s;min-height:58px}
.option:hover{border-color:#aaa}.option.selected{border:2px solid var(--red);padding:16px 17px;background:#fffafa}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;border:1px solid #ddd;border-radius:10px;padding:15px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--red)}
.full{grid-column:1/-1}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:5}
.bottom button{width:min(210px,42vw);border-radius:10px;padding:14px 12px;font-weight:700;border:1px solid var(--line);background:#fff}
.bottom .cancel{color:#777}.bottom .next{background:var(--red);color:#fff;border-color:var(--red)}
.bottom .skip{background:#fff;color:#555;border:1px dashed #aaa}
.bottom button:disabled{opacity:.35;cursor:not-allowed}
.summary{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:10px 0 18px}
.sumrow{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}.sumrow:last-child{border:0}.sumrow strong{text-align:right}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{border:0;border-radius:11px;padding:16px 10px;font-weight:800;background:var(--red);color:#fff}.actions button.secondary{background:#222}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;margin-top:14px}.archive-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.archive-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.archive-actions button,.plain-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.danger-btn{color:#b00000}.internal-grid{display:grid;gap:0}
.hidden{display:none!important}
.reminder-box{border:1px solid #ead6d6;background:#fffafa;border-radius:12px;padding:13px;margin-top:12px}
.reminder-box label{display:block;font-size:12px;font-weight:700;color:#666;margin:9px 0 5px}
.reminder-box select,.reminder-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff}
.reminder-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.reminder-tools button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:9px 11px;font-weight:700}
.reminder-tools .primary{background:#e30613;color:#fff;border-color:#e30613}
.reminder-due{font-size:12px;color:#9b4500;font-weight:700;margin-top:8px}

@media(max-width:520px){main{padding-top:18px}.fields{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:0 16px}.actions{grid-template-columns:1fr}}
@media print{
 body{background:#fff}.top,.live-tag,.progress,.bottom,.actions,.screen-only,#archive{display:none!important}
 main{width:100%;padding:0;display:block}.printdoc{display:block!important}
 .printdoc h1{font-size:25px}.printdoc .summary{border:0;padding:0}.printdoc .sumrow{font-size:13px}
}
.printdoc{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">VAL<span>MEX</span></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><small>Calculator ofertare · LIVE</small><button id="settingsBtn" style="border:1px solid #e8e8e8;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700">Setări</button><button id="archiveBtn" style="border:1px solid #e8e8e8;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700">Arhivă</button><button id="reminderBell" style="position:relative;border:1px solid #e8e8e8;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700" title="Mementouri">🔔 <span id="reminderCount">0</span></button><button id="onesignalEnableBtn" style="border:1px solid #e8e8e8;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700" type="button">Activează push</button></div></header>
<main>
  <div class="live-tag">CONVERSAȚIE LIVE</div>
  <div class="progress"><i id="bar"></i></div>
  <section id="screen" class="screen-only"></section>
  <section id="result" class="screen-only hidden"></section>
  <section id="archive" class="screen-only hidden"></section>
  <section id="printdoc" class="printdoc"></section>
  <section id="settingsPanel" class="panel hidden screen-only" style="position:fixed;z-index:20;inset:5vh 12px auto;max-height:90vh;overflow:auto;box-shadow:0 12px 50px #0003"></section>
</main>
<footer class="bottom" id="nav">
  <button class="cancel" id="back">← Înapoi</button>
  <button class="cancel" id="quit">Renunță</button>
  <button class="skip hidden" id="skipStep" type="button">Treci peste etapă</button>
  <button class="next hidden" id="continue">Continuă →</button>
</footer>
</div>
<script src="../supabase/functions/valmex-chat-api/calculation-engine.js"></script>
<script>
const $=id=>document.getElementById(id);
const SETTINGS_KEY='valmex_live_settings_v2';
const DEFAULT_SETTINGS={roofTariffs:[1250,1350,1450,1600],tileCost:136,accessoriesPercent:35,laborCost:300,consumables:10000,woodCostPerM3:6800,beamCostPerM3:4000,beamWidth:0.2,beamHeight:0.2,blockLengthCm:40,blockHeightCm:20,blockThicknessCm:20,blockWastePercent:0,masonryLaborPerM3:1600,commission:{3:5,4:6,6:8,10:13.5,12:15.5,18:20,24:25}};
function loadSettings(){
 const fallback={...DEFAULT_SETTINGS,roofTariffs:[...DEFAULT_SETTINGS.roofTariffs],commission:{...DEFAULT_SETTINGS.commission}};
 try{
  const x=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');
  if(!x||typeof x!=='object'||Array.isArray(x))return fallback;
  const merged={...fallback,...x};
  // Protejează încărcarea dacă setările vechi sunt incomplete sau au fost salvate într-un format invalid.
  if(!Array.isArray(x.roofTariffs)||x.roofTariffs.length!==4||x.roofTariffs.some(v=>!Number.isFinite(Number(v))||Number(v)<=0))merged.roofTariffs=[...DEFAULT_SETTINGS.roofTariffs];
  else merged.roofTariffs=x.roofTariffs.map(Number);
  merged.commission={...DEFAULT_SETTINGS.commission,...(x.commission&&typeof x.commission==='object'?x.commission:{})};
  for(const k of Object.keys(DEFAULT_SETTINGS)){
   if(k==='roofTariffs'||k==='commission')continue;
   if(!Number.isFinite(Number(merged[k]))||Number(merged[k])<0)merged[k]=DEFAULT_SETTINGS[k];
   else merged[k]=Number(merged[k]);
  }
  return merged;
 }catch(e){console.warn('VALMEX: setările salvate nu pot fi citite; se folosesc valorile inițiale.',e);return fallback;}
}
let settings=loadSettings();
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));return true}catch(e){alert('Setările nu au putut fi salvate în acest browser.');return false}}
const state={
 type:'turnkey', length:10,width:12, slopes:2,pitch:35,eave:.6,beam:'no',
 tile:'Kvadro 0,45 mm', tileNote:'Modelul și culoarea se aleg ulterior.', clientName:'', clientPhone:'', clientAddress:'', clientEmail:'',
 payment:'installments', months:12, payer:'valmex', price:1250,
 customPrice:1250, beamWidth:settings.beamWidth,beamHeight:settings.beamHeight,
  masonry:'no', masonryType:'walls', masonrySegments:[{length:0,heightCm:280}], masonryHeightCm:20, openingsArea:0, blockPrice:0, masonryLaborRate:1600,
  slab:'no', slabThickness:0, concretePrice:settings.concretePriceDefault, pumpCost:settings.pumpCostDefault, slabOtherCost:settings.slabOtherCostDefault,
  firstPayment:0, extraItems:[]
};
const history=[];
function stateDefaults(){return {type:'turnkey',length:10,width:12,slopes:2,pitch:35,eave:.6,beam:'no',tile:'Kvadro 0,45 mm',tileNote:'Modelul și culoarea se aleg ulterior.',clientName:'',clientPhone:'',clientAddress:'',clientEmail:'',payment:'installments',months:12,payer:'valmex',price:1250,customPrice:1250,beamWidth:settings.beamWidth,beamHeight:settings.beamHeight,masonry:'no',masonryType:'walls',masonrySegments:[{length:0,heightCm:280}],masonryHeightCm:20,openingsArea:0,blockPrice:0,masonryLaborRate:settings.masonryLaborPerM3,slab:'no',slabThickness:0,concretePrice:settings.concretePriceDefault,pumpCost:settings.pumpCostDefault,slabOtherCost:settings.slabOtherCostDefault,firstPayment:0,extraItems:[]};}
const steps=[
 {key:'type',q:'Ce tip de lucrare dorește clientul?',opts:[['turnkey','Acoperiș la cheie'],['install','Montare acoperiș'],['materials','Doar materiale']]},
 {key:'dimensions',q:'Care sunt dimensiunile casei?',hint:'Introdu dimensiunile în metri.',fields:[['length','Lungime (m)','number'],['width','Lățime (m)','number']]},
  {key:'masonry',q:'Este necesară executarea lucrărilor de zidărie?',opts:[['no','Nu'],['yes','Da']]},
  {key:'masonryType',q:'Ce tip de zidărie calculăm?',hint:'Alege suprafața care trebuie zidită.',opts:[['fronton','Fronton'],['walls','Pereți'],['custom','Altceva – dimensiuni manuale']]},
  {key:'masonryData',q:'Date pentru calculul zidăriei',hint:'Suprafața se calculează în m², apoi volumul în m³ folosind grosimea blocului configurată în Setări. Manopera se calculează pe m³.',fields:[['openingsArea','Suprafața golurilor (m²)','number',false],['blockPrice','Preț unitar bloc (lei/buc.)','number',false],['masonryLaborRate','Manoperă zidărie (lei/m³)','number',false]]},
  {key:'slab',q:'Este necesară turnarea planșeului din beton?',opts:[['no','Nu'],['yes','Da']]},
  {key:'slabData',q:'Date pentru calculul planșeului',hint:'Volum geometric; grinzile, golurile, pierderile și armătura nu sunt incluse automat.',fields:[['slabThickness','Grosime planșeu (cm)','number',true],['concretePrice','Preț beton (lei/m³)','number',false],['pumpCost','Cost pompă (lei, opțional)','number',false],['slabOtherCost','Alte cheltuieli (lei, opțional)','number',false]]},
 {key:'slopes',q:'Câte ape are acoperișul?',opts:[['2','2 ape'],['4','4 laturi (4 ape)'],['custom','Altă configurație']]},
 {key:'pitch',q:'Care este înclinația acoperișului?',opts:[['35','35° – standard'],['25','25°'],['30','30°'],['40','40°'],['45','45°'],['custom','Introduc manual']]},
 {key:'eave',q:'Cât este șandrama?',opts:[['0','Fără șandrama'],['0.4','40 cm'],['0.6','60 cm – standard'],['0.8','80 cm'],['1','100 cm'],['custom','Introduc manual']]},
 {key:'beam',q:'Este necesară centura de beton?',opts:[['no','Nu'],['yes','Da']]},
 {key:'tile',q:'Ce tip de învelitoare alegem?',opts:[['Kvadro 0,45 mm','Țiglă metalică Kvadro 0,45 mm'],['other','Alt model / se stabilește ulterior']]},
 {key:'price',q:'Care este tariful de vânzare?',opts:settings.roofTariffs.map(v=>[String(v),Number(v).toLocaleString('ro-RO')+' lei/m²']).concat([['custom','Introduc alt tarif']])},
 {key:'payment',q:'Cum achită clientul?',opts:[['cash','Plată integrală'],['installments','Plată în rate']]},
 {key:'months',q:'Pe ce perioadă solicită rate?',opts:[['3','3 luni'],['4','4 luni'],['6','6 luni'],['10','10 luni'],['12','12 luni'],['18','18 luni'],['24','24 luni']]},
 {key:'payer',q:'Cine suportă comisionul finanțării?',opts:[['valmex','VALMEX suportă comisionul'],['client','Clientul suportă comisionul']]},
  {key:'firstPaymentChoice',q:'Clientul achită un avans către VALMEX?',opts:[['no','Nu'],['yes','Da']]},
  {key:'firstPayment',q:'Care este suma avansului?',hint:'Introdu suma avansului achitat direct către VALMEX, în lei.',input:'number',placeholder:'Suma în lei'},
 {key:'clientName',q:'Care este numele clientului?',hint:'Introdu numele și prenumele.',input:'text',placeholder:'Nume și prenume'},
 {key:'clientPhone',q:'La ce număr de telefon contactăm clientul?',hint:'Prefixul +373 este fix. Introdu cele 8 cifre ale numărului din Republica Moldova.',input:'tel',placeholder:'XXXXXXXX'},
 {key:'clientAddress',q:'Unde se află obiectul lucrării?',hint:'Localitate și adresă. Acest câmp poate fi lăsat necompletat.',input:'text',placeholder:'Localitate, stradă...'},
 {key:'extras',q:'Lucrări suplimentare / nestandard',hint:'Adaugă orice lucrare sau material care nu apare în calculator. Fiecare poziție are descriere și preț fix în lei. Prețurile se adună automat la oferta finală.'},
 {key:'confirm',q:'Verifică datele lucrării',hint:'Confirmă pentru a genera oferta clientului și calculul intern.'}
];
let index=0, manualMode=false;
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n){return Number(n||0).toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money(n){return fmt(n)+' lei'}
function roofGeometry(){return VALMEX_CALC.roofGeometry(state)}
function area(){return VALMEX_CALC.area(state)}
function wood(){return VALMEX_CALC.wood(state)}
function commissions(){return VALMEX_CALC.commissions(state,settings)}
function costs(){return VALMEX_CALC.costs(state,settings)}

function render(){
 if(!Number.isInteger(index)||index<0||index>=steps.length)index=0;
 // Afișează zona înainte de a calcula opțiunile, astfel încât o eroare să nu lase ecranul gol.
 $('result').classList.add('hidden');$('archive').classList.add('hidden');$('screen').classList.remove('hidden');$('nav').classList.remove('hidden');
 $('bar').style.width=(index/(steps.length))*100+'%';
 const s=steps[index];
 const tariffs=Array.isArray(settings.roofTariffs)&&settings.roofTariffs.length?settings.roofTariffs:DEFAULT_SETTINGS.roofTariffs;
 const stepOptions=s.key==='price'?(state.type==='turnkey'?tariffs.map(v=>[String(v),Number(v).toLocaleString('ro-RO')+' lei/m²']).concat([['custom','Introduc alt tarif']]):[['custom',state.type==='install'?'Introduc tariful de montare (lei/m²)':'Introduc tariful materialelor (lei/m²)']]):s.opts;
 let question=s.q;if(s.key==='price')question=state.type==='turnkey'?'Care este tariful pentru acoperișul la cheie?':state.type==='install'?'Care este tariful de vânzare pentru montare (lei/m²)?':'Care este tariful de vânzare pentru materiale (lei/m²)?';
 let html=`<div class="stepcount">ÎNTREBAREA ${index+1} DIN ${steps.length}</div><h1>${question}</h1>${s.hint?`<p class="hint">${s.hint}</p>`:''}`;
 if(stepOptions){
  html+='<div class="options">';
  stepOptions.forEach(([v,label])=>html+=`<button class="option" data-value="${v}">${label}</button>`);
  html+='</div>';
 }
 if(s.fields){
  if(s.key==='masonryData'&&state.masonryType!=='custom'){html+=`<div class="field" style="margin-bottom:14px"><label>Înălțime zidărie (cm)</label><select id="masonryHeightCm">${Array.from({length:25},(_,i)=>(i+1)*20).map(v=>`<option value="${v}" ${Number(state.masonryHeightCm)===v?'selected':''}>${v} cm</option>`).join('')}</select></div>`;}
  if(s.key==='masonryData'&&state.masonryType==='custom'){const segments=Array.isArray(state.masonrySegments)&&state.masonrySegments.length?state.masonrySegments:[{length:0,heightCm:280}];html+=`<div class="options" id="masonrySegmentRows">${segments.map((segment,i)=>`<div class="panel" style="margin:0"><strong>Suprafața ${i+1}</strong><div class="fields" style="margin-top:10px"><div class="field"><label>Lungime (m)</label><input id="masonry_segment_length_${i}" type="number" min="0" step="any" value="${esc(segment.length??'')}"></div><div class="field"><label>Înălțime (cm)</label><input id="masonry_segment_height_${i}" type="number" min="0" step="any" value="${esc(segment.heightCm??'')}"></div></div>${segments.length>1?`<button type="button" class="plain-btn danger-btn" data-remove-masonry-segment="${i}" style="margin-top:10px">Elimină suprafața</button>`:''}</div>`).join('')}</div><button type="button" class="option" id="addMasonrySegment" style="text-align:center;margin:10px 0 14px">+ Adaugă altă suprafață</button>`;}
  html+='<div class="fields">';
  s.fields.forEach(([k,label,type,required=true])=>html+=`<div class="field"><label>${label}</label><input id="f_${k}" type="${type}" min="0" step="any" value="${esc(state[k]??0)}" ${required?"required":""}></div>`);
  html+='</div>';
 }
 if(s.input){
  if(s.key==='clientPhone'){html+=`<div class="fields"><div class="field full"><label>Telefon Moldova</label><div style="display:flex;align-items:center;gap:10px"><strong style="padding:14px;border:1px solid #ddd;border-radius:10px;background:#fff">+373</strong><input id="singleInput" type="tel" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" placeholder="XXXXXXXX" value="${esc(String(state.clientPhone||'').replace(/^\+373/,''))}" style="min-width:0;flex:1;padding:15px;border:1px solid #ddd;border-radius:10px"></div></div></div>`;}else html+=`<div class="fields"><div class="field full"><input id="singleInput" type="${s.input}" placeholder="${s.placeholder||''}" value="${esc(state[s.key]<0?'':(state[s.key]||''))}" autocomplete="on"></div></div>`;
 }
 if(s.key==='masonryData'&&state.masonryType==='custom'){$('addMasonrySegment').onclick=()=>{collectMasonrySegments();state.masonrySegments.push({length:0,heightCm:280});render();};document.querySelectorAll('[data-remove-masonry-segment]').forEach(b=>b.onclick=()=>{collectMasonrySegments();state.masonrySegments.splice(Number(b.dataset.removeMasonrySegment),1);if(!state.masonrySegments.length)state.masonrySegments.push({length:0,heightCm:280});render();});}
 if(s.key==='extras'){
  const items=Array.isArray(state.extraItems)?state.extraItems:[];
  html+='<div id="extraRows" class="options">';
  items.forEach((it,i)=>{html+=`<div class="panel" style="margin:0"><div class="fields"><div class="field full"><label>Descriere lucrare / material ${i+1}</label><input id="extra_desc_${i}" type="text" maxlength="180" placeholder="Ex.: Demontare acoperiș vechi" value="${esc(it.description||'')}"></div><div class="field"><label>Preț (lei)</label><input id="extra_price_${i}" type="number" min="0" step="0.01" value="${esc(it.price??'')}"></div><div class="field" style="justify-content:end"><button type="button" class="plain-btn" data-remove-extra="${i}">Elimină poziția</button></div></div></div>`;});
  html+='</div><button type="button" class="option" id="addExtra" style="text-align:center;margin-top:12px">+ Adaugă poziție suplimentară</button>';
  const extraSum=items.reduce((a,x)=>a+Math.max(0,Number(x.price)||0),0);
  html+=`<div class="summary" style="margin-top:14px">${row('Total lucrări suplimentare',money(extraSum))}<p class="note">Poți continua fără poziții suplimentare. Acestea vor apărea separat în oferta PDF și vor fi incluse în total.</p></div>`;
 }
 if(s.key==='confirm'){
  const c=costs();
  html+=`<div class="summary">
   ${row('Dimensiuni',state.length+' × '+state.width+' m')}${row('Acoperiș',(Number(state.slopes)===4?'4 laturi / 4 ape':'2 ape')+' · '+state.pitch+'° · șandrama '+Math.round(state.eave*100)+' cm')}

const REMINDER_KEY='valmex_live_reminders_v1';
function getReminders(){

  return Array.isArray(parsed)?parsed.filter(x=>x&&typeof x==='object'&&x.id!==undefined&&x.recordId!==undefined&&x.at):[];
 }catch(error){console.warn('VALMEX: datele mementourilor nu pot fi citite.',error);return []}

function saveReminders(a){

 updateReminderBell();
 // Salvarea locală rămâne disponibilă și fără internet; sincronizarea cloud rulează separat.

function updateReminderBell(){

}
// Sincronizare mementouri VALMEX LIVE cu Supabase.
// Nu folosim cheia secretă; aplicația folosește sesiunea utilizatorului autentificat și RLS.
let reminderSyncBusy=false;
async function getReminderDb(){
 if(!crmDb)crmDb=crmClient();
 if(!crmDb)return null;
 const {data,error}=await crmDb.auth.getSession();
 if(error)throw error;
 return data?.session?.user?{db:crmDb,user:data.session.user}:null;
}
function reminderCloudRow(reminder,userId){
 const archived=getArchive().find(x=>String(x.id)===String(reminder.recordId));
 const st=archived?.state||{};
 return {
  created_by:userId,
  assigned_to:userId,
  local_record_id:Number(reminder.recordId),
  client_name:String(st.clientName||reminder.clientName||'Client').slice(0,180),
  client_phone:String(st.clientPhone||reminder.clientPhone||'').slice(0,40)||null,
  message:String(reminder.text||'Revenire client').slice(0,500),
  template_index:Number.isInteger(Number(reminder.template))?Number(reminder.template):null,
  scheduled_at:new Date(reminder.at).toISOString(),
  status:reminder.done?'completed':(reminder.enabled?'pending':'cancelled'),
  notified_at:reminder.notified?new Date().toISOString():null,
  source:'VALMEX LIVE'
 };
}
async function syncRemindersToCloud(){
 if(reminderSyncBusy)return;
 const auth=await getReminderDb();if(!auth){const status=$('reminderSyncStatus');if(status)status.textContent='Conectează-te în CRM pentru sincronizarea între dispozitive';return;}
 const pending=getReminders().filter(x=>x&&x.recordId!==undefined&&x.at);
 if(!pending.length)return;
 reminderSyncBusy=true;
 try{
  const rows=pending.map(x=>reminderCloudRow(x,auth.user.id));
  const {error}=await auth.db.from('client_reminders').upsert(rows,{onConflict:'created_by,local_record_id'});
  if(error)throw error;
  const status=$('reminderSyncStatus');if(status)status.textContent='Sincronizat cu Supabase';
 }finally{reminderSyncBusy=false;}
}
async function syncRemindersFromCloud(){
 try{
  const auth=await getReminderDb();if(!auth){const status=$('reminderSyncStatus');if(status)status.textContent='Conectează-te în CRM pentru sincronizarea între dispozitive';return;}
  const {data,error}=await auth.db.from('client_reminders').select('local_record_id,client_name,client_phone,message,template_index,scheduled_at,status,notified_at').order('scheduled_at',{ascending:true});
  if(error)throw error;
  if(!Array.isArray(data))return;
  const local=getReminders();
  const cloudIds=new Set(data.map(x=>String(x.local_record_id)));
  const fromCloud=data.map(x=>({
   id:Number(x.local_record_id),recordId:Number(x.local_record_id),at:x.scheduled_at,
   template:Number.isInteger(x.template_index)?x.template_index:0,text:x.message,
   enabled:x.status==='pending',done:x.status==='completed',notified:!!x.notified_at,
   clientName:x.client_name||'Client',clientPhone:x.client_phone||''
  }));
  const merged=[...local.filter(x=>!cloudIds.has(String(x.recordId))),...fromCloud];
  localStorage.setItem(REMINDER_KEY,JSON.stringify(merged));
  updateReminderBell();
  const status=$('reminderSyncStatus');if(status)status.textContent='Sincronizat cu Supabase';
  // Trimite în cloud și mementourile create local înainte de conectare.
  const localOnly=local.filter(x=>!cloudIds.has(String(x.recordId)));
  if(localOnly.length)await syncRemindersToCloud();
 }catch(error){
  console.warn('VALMEX: încărcarea mementourilor din Supabase a eșuat:',error);
  const status=$('reminderSyncStatus');if(status)status.textContent='Nesincronizat – verifică autentificarea și conexiunea';
 }
}

function saveReminder(id){

 if(!at||!Number.isFinite(new Date(at).getTime())||new Date(at)<=new Date())return alert('Alege o dată și o oră din viitor.');

async function makeClientPdfBlob(){
 if(typeof window.html2canvas!=='function')throw new Error('Biblioteca html2canvas nu s-a încărcat. Verifică conexiunea la internet și reîncarcă pagina.');
 if(!window.jspdf || typeof window.jspdf.jsPDF!=='function')throw new Error('Biblioteca jsPDF nu s-a încărcat. Verifică conexiunea la internet și reîncarcă pagina.');
 makePdf('client',false);
 const source=$('printdoc');
 if(!source||!source.innerHTML.trim())throw new Error('Conținutul ofertei PDF este gol.');
 const wrap=document.createElement('div');
 wrap.setAttribute('aria-hidden','true');
 wrap.style.cssText='position:absolute;left:0;top:0;width:190mm;min-height:20mm;z-index:2147483647;background:#fff;color:#171717;padding:8mm;font-family:Arial,Helvetica,sans-serif;display:block;visibility:visible;opacity:1;pointer-events:none;';
 wrap.innerHTML=source.innerHTML;
 document.body.appendChild(wrap);
 try{
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  const canvas=await html2canvas(wrap,{
   scale:2,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,
   scrollX:0,scrollY:0,windowWidth:Math.max(794,wrap.scrollWidth),
   windowHeight:Math.max(1123,wrap.scrollHeight)
  });
  if(!canvas || canvas.width<300 || canvas.height<300)throw new Error('Conținutul ofertei nu a putut fi randat pentru PDF.');
  const imageData=canvas.toDataURL('image/jpeg',0.96);
  if(!imageData || imageData.length<1000)throw new Error('Imaginea ofertei este goală. PDF-ul nu a fost încărcat.');
  const {jsPDF}=window.jspdf || {};
  if(!jsPDF)throw new Error('Modulul jsPDF nu s-a încărcat.');
  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const pageWidth=pdf.internal.pageSize.getWidth();
  const pageHeight=pdf.internal.pageSize.getHeight();
  const margin=8;
  const contentWidth=pageWidth-margin*2;
  const contentHeight=canvas.height*contentWidth/canvas.width;
  let remaining=contentHeight, y=margin, sourceY=0;
  while(remaining>0){
   const sliceHeight=Math.min(pageHeight-margin*2,remaining);
   const sliceCanvas=document.createElement('canvas');
   sliceCanvas.width=canvas.width;
   sliceCanvas.height=Math.max(1,Math.round(sliceHeight*canvas.width/contentWidth));
   const ctx=sliceCanvas.getContext('2d');
   ctx.fillStyle='#ffffff';ctx.fillRect(0,0,sliceCanvas.width,sliceCanvas.height);
   ctx.drawImage(canvas,0,Math.round(sourceY*canvas.width/contentWidth),canvas.width,sliceCanvas.height,0,0,sliceCanvas.width,sliceCanvas.height);
   if(sourceY>0)pdf.addPage();
   pdf.addImage(sliceCanvas.toDataURL('image/jpeg',0.96),'JPEG',margin,margin,contentWidth,sliceHeight,undefined,'FAST');
   sourceY+=sliceHeight;remaining-=sliceHeight;
  }
  const blob=pdf.output('blob');
  if(!blob || blob.size<1000)throw new Error('PDF-ul generat nu conține date suficiente. Nu a fost încărcat în CRM.');
  const header=new Uint8Array(await blob.slice(0,5).arrayBuffer());
  if(String.fromCharCode(...header)!=='%PDF-')throw new Error('Fișierul generat nu are format PDF valid.');
  return blob;
 }finally{wrap.remove();}
}

 </div>${Number(state.slopes)===4?'<p>Acoperiș în 4 ape: calcul geometric separat pentru două versante trapezoidale și două triunghiulare. Suprafața poate coincide cu cea a unui acoperiș în 2 ape la aceeași amprentă și aceeași înclinație. Cantitățile de lemn sunt estimative și trebuie verificate la măsurători.</p>':''}`;

// OneSignal Web Push – conectează abonamentul browserului cu utilizatorul CRM.
window.OneSignalDeferred = window.OneSignalDeferred || [];
window.OneSignalDeferred.push(async function(OneSignal){
 const pushButton=$('onesignalEnableBtn');
 try{
  await OneSignal.init({
   appId:'4b147332-d5be-4573-b11e-a4aa8a4c2391',
   serviceWorkerPath:'/OneSignalSDKWorker.js',
   serviceWorkerParam:{scope:'/'}
  });
  if(pushButton){pushButton.disabled=false;pushButton.textContent='Activează notificările';}
  if(!crmDb)crmDb=crmClient();
  const attachIdentity=async()=>{
   if(!crmDb)return;
   const {data,error}=await crmDb.auth.getSession();
   if(error)throw error;
   const user=data?.session?.user;
   if(user?.id)await OneSignal.login(user.id);
  };
  await attachIdentity();
  if(crmDb)crmDb.auth.onAuthStateChange((_event,session)=>{
   if(session?.user?.id)OneSignalDeferred.push(async()=>{try{await OneSignal.login(session.user.id)}catch(e){console.warn('VALMEX OneSignal identity:',e)}});
   else OneSignalDeferred.push(async()=>{try{await OneSignal.logout()}catch(e){console.warn('VALMEX OneSignal logout:',e)}});
  });
  if(pushButton)pushButton.addEventListener('click',async()=>{
   pushButton.disabled=true;
   try{
    await OneSignal.Notifications.requestPermission();
    const optedIn=OneSignal.User.PushSubscription.optedIn;
    pushButton.textContent=optedIn?'Notificări activate':'Permite notificările';
    if(optedIn)await attachIdentity();
   }catch(e){console.error('VALMEX OneSignal permission:',e);alert('Activarea notificărilor nu a reușit. Verifică permisiunea browserului.');}
   finally{pushButton.disabled=false;}
  });
 }catch(error){
  console.error('VALMEX OneSignal initialization:',error);
  if(pushButton){pushButton.disabled=true;pushButton.textContent='Push indisponibil';pushButton.title='Verifică configurarea Web Push pentru valmex.md în OneSignal';}
 }
});
