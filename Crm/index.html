
<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>VALMEX CRM – Autentificare</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 410px;
      padding: 35px 28px;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0008;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    .logo span { color: #e30613; }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #ccc;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #111;
      border: 1px solid #444;
      border-radius: 9px;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus { border-color: #e30613; }

    .remember {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 18px 0;
      color: #bbb;
      font-size: 13px;
    }

    .remember input {
      width: 17px;
      height: 17px;
      accent-color: #e30613;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 9px;
      background: #e30613;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      min-height: 22px;
      margin-top: 17px;
      color: #ff7777;
      font-size: 13px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 28px;
      color: #666;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="login">
    <div class="logo">VAL<span>MEX</span></div>
    <div class="subtitle">Portal de acces pentru angajați și parteneri</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Adresa de email"
        required
      >

      <label for="password">Parolă</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Parola contului"
        required
      >

      <label class="remember">
        <input id="remember" type="checkbox" checked>
        Ține-mă conectat
      </label>

      <button id="submitButton" type="submit">
        Autentificare
      </button>

      <div id="message" role="status"></div>
    </form>

    <div class="footer">
      VALMEX BUSINESS · Acces pentru angajați și parteneri autorizați
    </div>
  </main>

<script>
const SUPABASE_URL = "https://qejnbbzhpvfjeqzwotwt.supabase.co";
const SUPABASE_KEY = "sb_publishable_xbF3ggFeZ475werOTmFWvA_Ho_cxYov";
const STORAGE_KEY = "sb-qejnbbzhpvfjeqzwotwt-auth-token";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("submitButton");
const rememberInput = document.getElementById("remember");

function createAuthClient(storage) {
  return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      storage,
      storageKey: STORAGE_KEY,
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });
}

// Refolosește sesiunea existentă, indiferent dacă este persistentă sau temporară.
let activeStorage = localStorage.getItem(STORAGE_KEY)
  ? localStorage
  : (sessionStorage.getItem(STORAGE_KEY) ? sessionStorage : localStorage);
let client = createAuthClient(activeStorage);

async function verifyProfile() {
  const { data: { session }, error } = await client.auth.getSession();
  if (error || !session) return false;

  const { data: profile, error: profileError } = await client
    .from("profiles")
    .select("id, full_name, role, active")
    .eq("id", session.user.id)
    .maybeSingle();

  if (profileError || !profile || profile.active !== true || !profile.role) {
    await client.auth.signOut();
    message.textContent = "Cont inactiv sau profil neconfigurat. Contactați administratorul.";
    return false;
  }

  // Administratorii și angajații activi intră în același CRM.
  // Permisiunile diferite sunt aplicate în module și, obligatoriu, prin RLS în Supabase.
  window.location.replace("dashboard.html");
  return true;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "";
  button.disabled = true;
  button.textContent = "Se verifică...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const targetStorage = rememberInput.checked ? localStorage : sessionStorage;

  try {
    // Dacă utilizatorul schimbă opțiunea de memorare, folosește depozitul ales.
    if (activeStorage !== targetStorage) {
      await client.auth.signOut();
      localStorage.removeItem(STORAGE_KEY);
      sessionStorage.removeItem(STORAGE_KEY);
      activeStorage = targetStorage;
      client = createAuthClient(activeStorage);
    }

    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) throw error;

    const valid = await verifyProfile();
    if (!valid) await client.auth.signOut();
  } catch (error) {
    message.textContent = error.message === "Invalid login credentials"
      ? "Email sau parolă incorectă."
      : "Autentificarea nu a reușit: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Autentificare";
  }
});

verifyProfile();
</script>
<script src="onesignal-auth.js?v=1" defer></script>
</body>
</html>
