<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>VALMEX CRM – Angajați</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#202124;font-family:Arial,sans-serif}header{background:#151515;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.logo span{color:#e30613}a{color:inherit}main{max-width:1000px;margin:28px auto;padding:0 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:25px;margin:0 0 6px}.muted{color:#777;font-size:13px}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:20px;margin-top:20px}.panel h2{font-size:17px;margin:0 0 16px}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}label{display:block;font-size:12px;color:#555;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid #d7d7d7;border-radius:8px;font:inherit}.full{grid-column:1/-1}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:11px 15px}.primary{background:#e30613;color:white;font-weight:bold}.secondary{background:#eee;color:#222}#message{font-size:13px;margin-top:12px;white-space:pre-wrap}.error{color:#b42318}.ok{color:#18794e}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #eee}th{color:#777}.pill{padding:4px 8px;border-radius:20px;background:#eee;font-size:11px}.on{background:#e7f6ec;color:#18794e}.off{background:#fdecec;color:#b42318}.empty{padding:18px;color:#777}@media(max-width:600px){form{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:15px}table{min-width:520px}}</style></head>
<body><header><div class="logo">VAL<span>MEX</span> CRM</div><a href="dashboard.html">← Înapoi la Dashboard</a></header><main>
<div class="top"><div><h1>Angajați</h1><div class="muted">Administrarea conturilor de acces VALMEX</div></div><button class="secondary" id="reload">Reîncarcă lista</button></div>
<section class="panel"><h2>Adaugă angajat</h2><form id="employeeForm">
<div><label for="fullName">Nume și prenume *</label><input id="fullName" required></div><div><label for="email">Email *</label><input id="email" type="email" required></div>
<div><label for="phone">Telefon</label><input id="phone" type="tel"></div><div><label for="position">Funcția</label><input id="position" placeholder="Ex.: Montator, responsabil lucrări"></div>
<div class="full"><label for="password">Parola inițială *</label><input id="password" type="password" minlength="8" required></div><div class="full"><button class="primary" id="createBtn">Creează cont angajat</button></div></form><div id="message"></div></section>
<section class="panel"><h2>Conturi existente</h2><div class="table-wrap"><table><thead><tr><th>Nume</th><th>ID utilizator</th><th>Rol</th><th>Statut</th></tr></thead><tbody id="employees"><tr><td colspan="4" class="empty">Se încarcă...</td></tr></tbody></table></div></section>
</main><script>
const URL="https://qejnbbzhpvfjeqzwotwt.supabase.co",KEY="sb_publishable_xbF3ggFeZ475werOTmFWvA_Ho_cxYov",db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
function msg(t,c="error"){$("message").textContent=t;$("message").className=c}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function admin(){const {data:{session},error}=await db.auth.getSession();if(error||!session){location.replace("index.html");return false}const {data:p,error:e}=await db.from("profiles").select("role,active").eq("id",session.user.id).maybeSingle();if(e||!p||!p.active||String(p.role).toLowerCase()!=="administrator"){document.querySelector("main").innerHTML="<section class='panel'><h2>Acces restricționat</h2><p>Modul disponibil doar administratorului.</p><a href='dashboard.html'>Înapoi</a></section>";return false}return true}
async function load(){const b=$("employees");b.innerHTML="<tr><td colspan='4' class='empty'>Se încarcă...</td></tr>";const {data,error}=await db.from("profiles").select("id,full_name,role,active").order("full_name");if(error){b.innerHTML="<tr><td colspan='4' class='empty'>Lista nu poate fi încărcată. Verificați politicile RLS pentru profiles.</td></tr>";return}const a=(data||[]).filter(x=>String(x.role||"").toLowerCase()==="employee");b.innerHTML=a.length?a.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.id)}</td><td>${esc(x.role)}</td><td><span class="pill ${x.active?'on':'off'}">${x.active?'Activ':'Suspendat'}</span></td></tr>`).join(""):"<tr><td colspan='4' class='empty'>Nu există încă angajați.</td></tr>"}
$("employeeForm").addEventListener("submit",async e=>{e.preventDefault();msg("");const payload={action:"create",full_name:$("fullName").value.trim(),email:$("email").value.trim(),password:$("password").value,phone:$("phone").value.trim(),position:$("position").value.trim()};if(payload.password.length<8){msg("Parola trebuie să conțină minimum 8 caractere.");return}$("createBtn").disabled=true;$("createBtn").textContent="Se creează...";try{const {data,error}=await db.functions.invoke("admin-manage-employees",{body:payload});if(error)throw error;if(data?.error)throw Error(data.error);msg("Cont creat. Angajatul se poate autentifica.","ok");$("employeeForm").reset();await load()}catch(err){msg("Crearea contului nu este încă disponibilă. Trebuie publicată funcția Supabase admin-manage-employees. Detalii: "+(err.message||"eroare"))}finally{$("createBtn").disabled=false;$("createBtn").textContent="Creează cont angajat"}});
$("reload").onclick=load;(async()=>{if(await admin())await load()})();
</script></body></html>
