<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717"><title>VALMEX CRM – Oferte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="services/supabase.js"></script><script src="services/auth.js"></script><script src="services/permissions.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font:14px Arial,sans-serif}.top{background:#171717;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.brand{font-weight:900;font-size:20px}.brand span{color:#e30613}.top button,.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.top button{background:#fff;color:#222}.wrap{max-width:1200px;margin:auto;padding:24px}.head h1{margin:0 0 5px}.head p{color:#777;margin:0 0 18px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.tools input,.tools select{padding:11px;border:1px solid #ddd;border-radius:8px;background:#fff;flex:1;min-width:180px}.list{display:grid;gap:12px}.quote{background:white;border:1px solid #e6e6e6;border-radius:12px;padding:16px}.quote-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.code{font-weight:800}.status{padding:5px 9px;border-radius:20px;background:#eee;font-size:11px}.meta{color:#777;font-size:12px;margin-top:8px}.total{font-size:20px;font-weight:800;margin-top:12px}.items{margin-top:12px;border-top:1px solid #eee;padding-top:10px;font-size:12px;color:#555}.empty{padding:30px;text-align:center;background:white;border-radius:12px;color:#666}.err{color:#b00}.btn{background:#e30613;color:#fff}.foot{color:#777;font-size:12px;margin-top:16px}@media(max-width:600px){.wrap{padding:14px}.quote{padding:14px}}
</style></head><body><div id="app"><div class="wrap">Se încarcă registrul...</div></div>
<script>
(async()=>{const root=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('ro-MD',{minimumFractionDigits:2,maximumFractionDigits:2})+' lei';
try{const ctx=await VALMEX_AUTH.requireSession();if(!ctx)return;const {profile}=ctx;if(!VALMEX_PERMISSIONS.canSeeModule('quotations',profile)){root.innerHTML='<div class="wrap">Acces restricționat.</div>';return}
root.innerHTML='<header class="top"><div class="brand">VAL<span>MEX</span> · CRM</div><div><button id="dash">Dashboard</button> <button id="out">Ieșire</button></div></header><main class="wrap"><div class="head"><h1>Registru oferte</h1><p>Vizualizare ofertelor salvate, cu total calculat din pozițiile existente.</p></div><div class="tools"><input id="search" placeholder="Caută cod, client, titlu, telefon..."><select id="status"><option value="">Toate stările</option></select></div><div id="list" class="list">Se încarcă...</div><p class="foot">Totalurile afișate sunt calculate din pozițiile devizului, aplicând reducerea pe poziție și reducerea devizului. Accesul la date este controlat de Supabase RLS.</p></main>';
document.getElementById('dash').onclick=()=>location.href='dashboard.html';document.getElementById('out').onclick=()=>VALMEX_AUTH.signOut();
const db=VALMEX_DB;const [qres,ires,clres,pres]=await Promise.all([db.from('quotations').select('id,quotation_code,version,client_id,project_id,title,status,issue_date,valid_until,discount_percent,notes,created_at,is_current').order('created_at',{ascending:false}).limit(500),db.from('quotation_items').select('quotation_id,name,quantity,unit,unit_price,discount_percent,line_total,position').order('position'),db.from('clients').select('id,first_name,last_name,client_code,phone,locality,address'),db.from('projects').select('id,project_code,title,address')]);if(qres.error)throw qres.error;if(ires.error)throw ires.error;if(clres.error)throw clres.error;if(pres.error)throw pres.error;
const clients=new Map((clres.data||[]).map(x=>[x.id,x])),projects=new Map((pres.data||[]).map(x=>[x.id,x])),items=new Map();(ires.data||[]).forEach(x=>{if(!items.has(x.quotation_id))items.set(x.quotation_id,[]);items.get(x.quotation_id).push(x)});
const records=(qres.data||[]).map(q=>{const it=items.get(q.id)||[],subtotal=it.reduce((s,x)=>s+Number(x.line_total||0),0),total=subtotal*(1-Number(q.discount_percent||0)/100);return{...q,client:clients.get(q.client_id),project:projects.get(q.project_id),items:it,total}});
const statuses=[...new Set(records.map(x=>x.status).filter(Boolean))];document.getElementById('status').innerHTML='<option value="">Toate stările</option>'+statuses.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join('');
function render(){const term=document.getElementById('search').value.toLowerCase(),st=document.getElementById('status').value;const filtered=records.filter(q=>{const c=q.client||{},p=q.project||{},s=[q.quotation_code,q.title,q.status,c.first_name,c.last_name,c.phone,c.client_code,p.title,p.project_code].join(' ').toLowerCase();return(!term||s.includes(term))&&(!st||q.status===st)});const list=document.getElementById('list');if(!filtered.length){list.innerHTML='<div class="empty">Nu au fost găsite oferte pentru filtrul selectat.</div>';return}list.innerHTML=filtered.map(q=>{const c=q.client||{},p=q.project||{},name=[c.first_name,c.last_name].filter(Boolean).join(' ')||'Client nespecificat';return '<article class="quote"><div class="quote-head"><div><div class="code">'+esc(q.quotation_code||'Deviz')+' · v'+esc(q.version||1)+(q.is_current?' · <span style="color:#13853b">Actual</span>':'')+'</div><div style="font-weight:700;margin-top:6px">'+esc(name)+'</div><div class="meta">'+esc(c.phone||'')+' · '+esc(c.locality||c.address||p.address||'')+'</div><div class="meta">'+esc(q.title||p.title||'')+'</div></div><span class="status">'+esc(q.status||'fără status')+'</span></div><div class="meta">Data: '+esc(q.issue_date||new Date(q.created_at).toLocaleDateString('ro-MD'))+' · Proiect: '+esc(p.project_code||'—')+'</div><div class="total">'+money(q.total)+'</div><div class="items"><strong>Poziții ('+q.items.length+')</strong><br>'+q.items.slice(0,6).map(x=>esc(x.name)+' · '+esc(x.quantity)+' '+esc(x.unit||'')+' × '+money(x.unit_price)+' = '+money(x.line_total)).join('<br>')+(q.items.length>6?'<br>...':'')+(Number(q.discount_percent||0)?'<br>Reducere deviz: '+esc(q.discount_percent)+'%':'')+'</div></article>'}).join('')}
document.getElementById('search').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);render();
}catch(e){root.innerHTML='<div class="wrap err">Registrul nu a putut fi încărcat: '+esc(e.message||e)+'</div>'}})();
</script></body></html>
